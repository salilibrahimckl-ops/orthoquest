name: On-phone AI quality test
on:
  push:
    branches: [apk-shell]
    paths: ["qtest/**", ".github/workflows/qtest.yml"]
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          set -e
          URL=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | python3 -c "import sys,json;a=json.load(sys.stdin)['assets'];print([x['browser_download_url'] for x in a if x['name'].endswith('bin-ubuntu-x64.zip')][0])")
          curl -sL -o llama.zip "$URL" && unzip -q llama.zip -d llama && find llama -name llama-server -type f | head -1 > server_path
          curl -sL -o m15.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          curl -sL -o m3.gguf https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
          cd qtest && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Run
        run: |
          S=$(cat server_path); chmod +x "$S"; export LD_LIBRARY_PATH=$(dirname "$S"):$LD_LIBRARY_PATH
          for m in m15 m3; do
            "$S" -m $m.gguf -c 4096 --port 8080 > srv_$m.log 2>&1 &
            PID=$!; for i in $(seq 1 60); do curl -s localhost:8080/health | grep -q ok && break; sleep 2; done
            node qtest/run.js qtest/out_$m.json || true
            kill $PID; sleep 2
          done
          tail -5 srv_m15.log > qtest/srv.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add qtest/out_*.json qtest/srv.txt
          git commit -m "Quality test results [skip ci]" || exit 0
          git push
