name: Daily AI trial
on:
  push:
    branches: [apk-shell]
    paths: [".github/workflows/daily-trial.yml", "trial/orthoss-prep/tools/daily_ai.js"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cd trial && DAILY_NEW=12 DAILY_PROOF=0 MAX_MINUTES=14 node orthoss-prep/tools/daily_ai.js run 2>&1 | tee run.log
          node orthoss-prep/tools/daily_ai.js apply | tee -a run.log
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add trial/run.log trial/out trial/orthoss-prep/drafts; git commit -m "Daily trial [skip ci]" || exit 0; git push
