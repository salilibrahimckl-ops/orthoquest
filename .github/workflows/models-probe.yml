name: Models probe
on:
  push:
    branches: [apk-shell]
    paths: [".github/workflows/models-probe.yml"]
permissions:
  contents: write
  models: read
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p probe
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://models.github.ai/catalog/models | python3 -c "import sys,json;d=json.load(sys.stdin);[print(m.get('id'),'|',m.get('rate_limit_tier'),'|',m.get('publisher')) for m in d]" > probe/models.txt 2>&1
          for M in openai/gpt-4.1 openai/gpt-5 openai/gpt-4o deepseek/deepseek-r1 anthropic/claude-sonnet-4; do
            echo "== $M" >> probe/models_test.txt
            curl -s -m 120 -w "\nHTTP %{http_code} TIME %{time_total}\n" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" https://models.github.ai/inference/chat/completions -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"In the Schatzker classification, which type is a pure lateral split? Answer in 5 words.\"}],\"max_tokens\":50}" | tail -c 500 >> probe/models_test.txt
          done
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe; git commit -m "Models probe [skip ci]" || exit 0; git push
