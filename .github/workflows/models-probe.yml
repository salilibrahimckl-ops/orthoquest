name: Models probe
on:
  push:
    branches: [apk-shell]
    paths: [".github/workflows/models-probe.yml"]
permissions:
  contents: write
  models: read
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p probe; : > probe/models_test.txt
          curl -s -i -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://models.github.ai/catalog/models | head -c 3000 > probe/models.txt
          for M in openai/gpt-4.1 openai/gpt-5 deepseek/deepseek-r1-0528 xai/grok-3; do
            echo "== $M" >> probe/models_test.txt
            curl -s -i -m 120 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" https://models.github.ai/inference/chat/completions -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"In the Schatzker classification, which type is a pure lateral split? Answer in 5 words.\"}]}" | grep -iE "^(HTTP|x-ratelimit)|content" | head -c 900 >> probe/models_test.txt
            echo >> probe/models_test.txt
          done
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add probe; git commit -m "Models probe [skip ci]" || exit 0; git push
