name: Ortho preSSaleel - build notes PDFs
on:
  push:
    branches: [main]
    paths: ["orthoss-prep/notes/**", "orthoss-prep/tools/notes_pdf.js"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orthoss-notes-pdf
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium for printing
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core >/dev/null 2>&1 || true
      - name: Build PDFs and commit
        run: |
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            NODE_PATH=/tmp/pw/node_modules node orthoss-prep/tools/notes_pdf.js || exit 1
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add orthoss-prep/pdf
            git diff --cached --quiet && exit 0
            git commit -qm "Notes PDFs rebuilt [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep $((i*5))
          done
