  {q:"Chondrolysis after SCFE fixation is most associated with:",o:["Unrecognised persistent penetration of the joint by pins or screws","Using a single central screw","Early weight-bearing","Obesity"],a:0,e:"Check the screw in multiple planes while moving the hip; chondrolysis presents with pain, stiffness and joint-space narrowing."},
  {q:"For a severe or unstable SCFE, the modified Dunn procedure realigns the epiphysis:",o:["At the subcapital level through a surgical hip dislocation, protecting the retinacular vessels on a soft-tissue flap","By an intertrochanteric osteotomy","By closed manipulation under traction","By arthroscopic osteoplasty alone"],a:0,e:"It restores anatomy but carries a learning curve and an avascular necrosis risk; it is done in specialist centres."},
  {q:"After in-situ fixation of a stable SCFE, a common long-term mechanical consequence of residual deformity is:",o:["Cam-type femoroacetabular impingement from the prominent anterior metaphysis","Coxa valga","Leg lengthening","Protrusio acetabuli"],a:0,e:"The metaphyseal 'bump' left by a posteriorly slipped epiphysis can impinge on the acetabular rim in flexion and internal rotation."}],
 "tkr-keblish":[
  {q:"The lateral parapatellar (Keblish) approach for TKA is mainly indicated for:",o:["A fixed valgus knee","A fixed varus knee","Revision for infection","Every primary TKA"],a:0,e:"The approach goes through the tight lateral side, so the lateral release is part of the exposure."},
  {q:"An advantage of the lateral parapatellar approach in valgus TKA is that it:",o:["Avoids combining a medial arthrotomy with a lateral release, which together devascularise the patella","Makes patellar eversion easier than a medial arthrotomy","Avoids the infrapatellar branch of the saphenous nerve in every case","Needs no soft-tissue balancing"],a:0,e:"After a medial arthrotomy, the superior lateral genicular artery is the main remaining patellar supply — a lateral release can divide it."},
  {q:"In the Keblish approach the lateral capsular defect left after correcting valgus is closed using:",o:["The preserved infrapatellar fat pad (and lateral soft tissue) as a flap","The medial retinaculum","A synthetic mesh routinely","Nothing — it is left open"],a:0,e:"The fat pad is kept attached laterally during the arthrotomy for this purpose."},
  {q:"A recognised difficulty of the lateral parapatellar approach is:",o:["Medial displacement of the patella is harder, often needing a tibial tubercle osteotomy","Excessive bleeding from the medial genicular vessels","Injury to the femoral nerve","Inability to cut the tibia"],a:0,e:"Never force the patella against the tendon insertion — avulsion of the patellar tendon is a disaster."},
  {q:"In a valgus knee, the lateral structure tight mainly in EXTENSION and the one tight mainly in FLEXION are:",o:["Iliotibial band (extension) and popliteus tendon (flexion)","Popliteus (extension) and iliotibial band (flexion)","LCL (extension) and MCL (flexion)","Biceps femoris (both)"],a:0,e:"The LCL and posterolateral capsule affect both gaps; release sequentially and recheck."},
  {q:"In valgus knees with a hypoplastic lateral femoral condyle, referencing femoral rotation off the posterior condylar axis tends to:",o:["Internally rotate the femoral component, causing patellar maltracking","Externally rotate the femoral component excessively","Have no effect","Lengthen the leg"],a:0,e:"Use the transepicondylar axis and Whiteside's (AP) line instead in valgus knees."}],
 "olecranon-plate":[
  {q:"Plate fixation rather than tension-band wiring is preferred for olecranon fractures that are:",o:["Comminuted, oblique distal to the mid-notch, Monteggia-type or fracture-dislocations","Simple transverse in the middle of the notch","Undisplaced","Avulsions of the triceps tip only"],a:0,e:"Tension bands rely on a solid anterior cortex to compress against; comminution collapses."},
  {q:"A dorsal olecranon plate is placed on the:",o:["Tension (dorsal) surface, its proximal end tucked under the triceps through a longitudinal split","Volar surface of the ulna","Lateral surface over anconeus only","Top of the triceps tendon"],a:0,e:"Placing the hook or proximal end under triceps reduces prominence and improves proximal hold."},
  {q:"During olecranon plating, screws or drills directed long and medially from the proximal fragment endanger:",o:["The ulnar nerve in the cubital tunnel","The radial nerve","The median nerve","The posterior interosseous nerve"],a:0,e:"Measure carefully and keep medial screws short; the nerve lies on the medial side of the olecranon."},
  {q:"In comminuted olecranon fractures, the articular fragments are reduced:",o:["Onto the trochlea as a template, restoring the true length of the trochlear notch","By compressing the main fragments together","By discarding small fragments","Without regard to the joint, because the elbow is non-weight-bearing"],a:0,e:"A shortened notch is incongruent and stiff; graft defects where needed and bridge with the plate."},
  {q:"In a transolecranon fracture-dislocation, a large coronoid fragment can be fixed:",o:["Through the olecranon fracture window before the olecranon is reduced and plated","Only through a separate anterior approach","Never — it is excised","With a cast alone"],a:0,e:"The olecranon fracture gives direct access to the coronoid; the ulnohumeral joint must end concentric."},
  {q:"The commonest reason for further surgery after olecranon plating is:",o:["Symptomatic hardware","Non-union","Infection","Ulnar nerve palsy"],a:0,e:"Low-profile precontoured plates under the triceps reduce, but do not remove, hardware irritation."}],
 supracon:[
  {q:"A Gartland type IV supracondylar humerus fracture is defined by:",o:["Multidirectional instability — unstable in both flexion and extension, usually recognised under anaesthesia","An intact posterior hinge with angulation only","Rotational malalignment with an intact posterior cortex","Flexion-type displacement"],a:0,e:"The periosteal hinge is torn circumferentially; reduction is often done with the arm rotated rather than the C-arm, and pins are placed with care as the fragment flips."},
  {q:"In an extension-type supracondylar fracture with POSTEROLATERAL displacement of the distal fragment, the proximal fragment spike most threatens:",o:["The median nerve and brachial artery","The radial nerve","The ulnar nerve","The posterior interosseous nerve"],a:0,e:"The spike goes anteromedially; posteromedial displacement drives it anterolaterally against the radial nerve."},
  {q:"Compared with crossed medial–lateral pins, two or three divergent lateral-entry pins for Gartland III fractures give:",o:["Similar maintenance of reduction without the risk of iatrogenic ulnar nerve injury","Clearly more loss of reduction","Higher rates of cubitus varus in all trials","No need for intraoperative stress testing"],a:0,e:"Technique matters: maximal spread at the fracture, bicortical purchase and engagement of both columns."},
  {q:"After closed reduction and pinning, the hand is warm and pink but the radial pulse is still absent. Current guidance (BOAST 11) recommends:",o:["Inpatient observation with regular neurovascular checks, exploring if perfusion deteriorates","Immediate exploration of every pulseless hand","Angiography before discharge","Removing the pins and re-reducing"],a:0,e:"A white, poorly perfused hand after reduction needs urgent exploration through an anterior approach, ideally with a vascular surgeon."},
  {q:"On a lateral radiograph of a normal child's elbow, the anterior humeral line passes through:",o:["The middle third of the capitellum","The anterior third of the capitellum or in front of it","The centre of the olecranon","The radial head"],a:0,e:"In extension-type fractures it passes anterior to the capitellum — the posteriorly displaced distal fragment."},
  {q:"Loss of reduction after lateral-pin fixation of a supracondylar fracture is most associated with:",o:["Pins converging so they are less than about 2 mm apart at the fracture site, or missing a column","Pins that are too divergent","Using 2.0 mm rather than 1.6 mm wires","An above-elbow backslab"],a:0,e:"Spread the pins across the fracture, engage both the medial and lateral columns and the opposite cortex."},
  {q:"Cubitus varus after a supracondylar fracture usually results from:",o:["Coronal malreduction or medial column collapse, not growth disturbance — and it does not remodel","Physeal arrest of the lateral condyle","Overgrowth of the medial epicondyle","Radial head dislocation"],a:0,e:"Baumann angle on the AP view checks coronal alignment; correction is by a lateral closing-wedge (French or modified) osteotomy."},
  {q:"After pinning, the elbow is immobilised:",o:["In no more than about 60–90° of flexion in an above-elbow backslab, with pins removed at about 3–4 weeks","Hyperflexed beyond 120° in a collar and cuff","Fully extended in a cylinder cast","Free, without any splint"],a:0,e:"Hyperflexion of a swollen elbow compromises the brachial artery and raises forearm compartment pressure."}],
 tkr:[
  {q:"Femoral component rotation in TKA is classically referenced to:",o:["The transepicondylar axis (about 3° external to the posterior condylar axis)","The anatomical axis of the femur","The tibial tubercle","The posterior condylar axis in 3° internal rotation"],a:0,e:"Internal rotation of the femoral component causes patellar maltracking."},
  {q:"After TKA trialling, the knee is tight in BOTH flexion and extension. The fix:",o:["Resect more proximal tibia","Downsize the femoral component","Resect more distal femur","Increase the polyethylene thickness"],a:0,e:"A symmetric problem in both gaps is corrected on the tibial side."},
  {q:"Tight in flexion, balanced in extension. The usual fix:",o:["Downsize the femoral component or increase the posterior tibial slope","Resect more distal femur","Use a thicker insert","Release the MCL superficial layer completely"],a:0,e:"Flexion-only problems are corrected on the posterior femur or with slope."},
  {q:"Patellar clunk syndrome is associated with:",o:["Posterior-stabilised designs — a fibrous nodule at the superior pole of the patella","Cruciate-retaining designs only","Unicompartmental knees","Patellar resurfacing with an inlay button"],a:0,e:"The nodule catches in the box of the femoral component as the knee extends."},
  {q:"Common peroneal palsy after TKA is most associated with correcting:",o:["Valgus with flexion contracture","Varus with flexion contracture","Recurvatum","Pure varus"],a:0,e:"Flex the knee, remove tight dressings; most recover partially."},
  {q:"In the coronal plane the tibial cut in mechanical-alignment TKA is made:",o:["Perpendicular to the tibial mechanical axis","In 5° varus","In 7° valgus","Parallel to the joint line in varus"],a:0,e:"Kinematic alignment differs, but classic mechanical TKA cuts perpendicular."},
  {q:"In registry data, the commonest reason for revision of a TKA within the first two years is:",o:["Infection","Aseptic loosening","Polyethylene wear","Patellar fracture"],a:0,e:"Aseptic loosening and wear dominate later revisions."},
  {q:"A pseudo patella baja after TKA usually results from:",o:["Elevating the joint line (e.g. excess distal femoral resection with a thicker insert)","Lowering the joint line","Patellar resurfacing","Using a posterior-stabilised design"],a:0,e:"Keep the joint line within a few millimetres of native."},
  {q:"During cruciate-retaining TKA trialling, the tibial trial lifts off anteriorly in deep flexion. This indicates:",o:["A tight PCL (tight flexion gap) — recess the PCL or add posterior slope","A loose MCL","Patellar maltracking","An oversized tibial tray"],a:0,e:"Excess rollback from a tight PCL also accelerates posterior polyethylene wear."},
  {q:"With several old longitudinal scars around the knee, which do you use for a TKA?",o:["The most lateral usable scar","The most medial scar","A new incision parallel to and 2 cm from the old one","A transverse incision"],a:0,e:"Skin blood supply runs from medial to lateral, so a lateral-based incision leaves the medial flap well perfused."}],
 thr:[
  {q:"After a posterior-approach THR, which combined position should the patient avoid?",o:["Flexion beyond 90°, adduction and internal rotation","Extension, abduction and external rotation","Abduction alone","Prone lying"],a:0,e:"That is the position of posterior dislocation."},
  {q:"Sciatic nerve palsy after THR most often affects:",o:["The peroneal division","The tibial division","Both divisions equally","Only the posterior femoral cutaneous nerve"],a:0,e:"The peroneal division is more lateral and tethered."},
  {q:"Brooker classification grades:",o:["Heterotopic ossification after hip surgery","Acetabular bone loss","Periprosthetic femoral fractures","Cup position"],a:0,e:"Prophylaxis: NSAIDs such as indomethacin, or single-dose radiotherapy."},
  {q:"Vancouver B2 periprosthetic femoral fracture means:",o:["Fracture around the stem with a loose stem and good bone — revise to a long stem","Fracture at the trochanters","Well-fixed stem — plate fixation","Loose stem with poor bone stock"],a:0,e:"B1 well fixed (ORIF); B2 loose, good bone (revise); B3 loose, poor bone (revise + augment)."},
  {q:"Paprosky classification describes:",o:["Acetabular and femoral bone loss in revision arthroplasty","Heterotopic ossification","Infection chronicity","Leg-length discrepancy"],a:0,e:"It guides reconstruction choices in revision THR."},
  {q:"The most common cause of early THR dislocation is:",o:["Component malposition and soft-tissue deficiency","Polyethylene wear","Stem loosening","Late infection"],a:0,e:"Late dislocations relate more to wear and abductor failure."},
  {q:"The Watson-Jones (anterolateral) hip approach uses the interval between:",o:["Tensor fasciae latae and gluteus medius — intermuscular, not internervous (both superior gluteal n.)","Sartorius and TFL","Gluteus maximus fibres split in line","Rectus femoris and sartorius"],a:0,e:"Both muscles share the superior gluteal nerve, so dissect no more than a few centimetres above the trochanter."},
  {q:"A Dorr type C (stovepipe) proximal femur, with thin cortices and a wide canal, generally favours:",o:["A cemented femoral stem","A press-fit tapered uncemented stem","A short metaphyseal stem","Hip resurfacing"],a:0,e:"Dorr A is a narrow 'champagne flute' canal, B intermediate, C a wide stovepipe in which uncemented fit and fill are poor."},
  {q:"A new Trendelenburg gait after THR through a direct lateral (Hardinge) approach most likely reflects:",o:["Failure of the abductor repair or injury to the superior gluteal nerve","Peroneal-division sciatic palsy","Femoral nerve palsy","A cup in 15° of anteversion"],a:0,e:"The approach detaches the anterior gluteus medius; a medius split more than about 5 cm above the trochanter risks the nerve."},
  {q:"In the posterior approach, the short external rotators are divided with the hip held in:",o:["Internal rotation — it tensions them and moves their insertion away from the sciatic nerve","External rotation","Full flexion and adduction","Neutral with the knee extended"],a:0,e:"Internal rotation also keeps the nerve out of the field; tag the tendons for the posterior repair."},
  {q:"A characteristic complication of ceramic-on-ceramic bearings is:",o:["Audible squeaking and, rarely, ceramic fracture","Pseudotumour from metal ions","High volumetric polyethylene wear","Osteolysis from polyethylene debris"],a:0,e:"Modern ceramics have very low wear; a fractured ceramic needs a ceramic revision bearing, never metal on the residual fragments."}],
 nail:[
  {q:"Femoral shaft fracture with an ipsilateral femoral neck fracture. The priority is:",o:["Reduce and fix the femoral neck first","Nail the shaft first, then the neck","Treat the neck conservatively","Traction for both"],a:0,e:"The neck carries the risk of AVN and nonunion; it takes priority."},
  {q:"Fat embolism syndrome typically appears:",o:["24–72 hours after injury","Within 1 hour","After 7 days","Only after reaming"],a:0,e:"Early stabilisation of long-bone fractures lowers the risk."},
  {q:"During freehand distal locking the hole looks oval. You should:",o:["Adjust the C-arm until you see a perfect circle","Drill anyway at the centre of the oval","Switch to proximal locking only","Increase the drill speed"],a:0,e:"A perfect circle means the beam is coaxial with the hole."},
  {q:"Relative indication for a RETROGRADE femoral nail:",o:["Ipsilateral tibial fracture (floating knee), obesity or pregnancy","Open knee wound","Proximal-third fracture","Skeletally immature patient"],a:0,e:"Retrograde nailing avoids hip-region positioning issues."},
  {q:"Compared with unreamed nailing, reamed femoral nailing gives:",o:["Higher union rates","More nonunion","No difference in union","More infection in closed fractures"],a:0,e:"Reaming allows a larger nail and adds autograft at the fracture."},
  {q:"Rotation after femoral nailing is best checked by:",o:["Comparing the lesser trochanter profile with the other side (or CT if unsure)","AP view of the knee only","Leg length alone","Palpating the greater trochanter"],a:0,e:"Malrotation over 15° is poorly tolerated."},
  {q:"With a piriformis-entry antegrade femoral nail, a starting point that is too anterior risks:",o:["Iatrogenic comminution (bursting) of the proximal femur from hoop stresses","Varus malalignment only","Injury to the femoral nerve","Distal anterior cortical perforation only"],a:0,e:"An anterior start creates high hoop stresses in the proximal fragment; aim in line with the canal on both views."},
  {q:"A femoral nail whose radius of curvature is larger (straighter) than the patient's femoral bow tends to:",o:["Abut or perforate the anterior cortex of the distal femur","Perforate the posterior cortex distally","Produce varus at the fracture","Shorten the femur"],a:0,e:"The femoral bow (radius about 1–1.2 m) is tighter than most nails; the mismatch is worst in elderly, bowed femurs."},
  {q:"Winquist-Hansen grade III comminution of a femoral shaft fracture means:",o:["Less than 50% cortical contact between the main fragments","No comminution","A small butterfly fragment with over 50% contact","Segmental bone loss with no contact"],a:0,e:"Grade I minimal, II at least 50% contact, III less than 50% contact, IV circumferential comminution with no contact — modern nails are statically locked whatever the grade."},
  {q:"In damage-control orthopaedics for a femoral shaft fracture in a polytrauma patient, the usual plan is:",o:["Temporary external fixation, then conversion to a nail when physiology allows, ideally within about 2 weeks","Immediate reamed nailing regardless of physiology","Skeletal traction for 8 weeks","External fixation as definitive treatment"],a:0,e:"Early conversion keeps the infection risk low; nailing a physiologically unstable patient adds a 'second hit'."}],
 "tkr-subvastus":[
  {q:"The main anatomical advantage of the subvastus approach for TKA is that it:",o:["Leaves the quadriceps tendon and the VMO insertion on the patella intact","Gives the widest exposure in obese knees","Avoids the infrapatellar branch of the saphenous nerve","Allows routine patellar eversion"],a:0,e:"Trials show less early pain and faster straight-leg raise; long-term function is similar to medial parapatellar."},
  {q:"Proximal elevation of VMO in the subvastus approach is limited by:",o:["The femoral vessels passing through the adductor hiatus, about 10 cm above the adductor tubercle","The superior gluteal nerve","The common peroneal nerve","The insertion of rectus femoris"],a:0,e:"The saphenous nerve also leaves the adductor canal here; stay in the loose plane under VMO distal to the hiatus."},
  {q:"The midvastus approach differs from the subvastus approach because it:",o:["Splits VMO in line with its fibres from the superomedial pole of the patella","Lifts VMO from its inferior border off the septum","Incises the quadriceps tendon in the midline","Goes lateral to the patella"],a:0,e:"Both spare the quadriceps tendon; midvastus is easier to extend in bigger knees."},
  {q:"Relative contraindications to the subvastus approach include:",o:["Obesity, poor preoperative flexion and previous arthrotomy or high tibial osteotomy","A slim patient with a varus knee","Primary osteoarthritis","Age under 65"],a:0,e:"In these knees the intact extensor mechanism cannot be displaced enough for safe exposure."},
  {q:"After a medial parapatellar arthrotomy, adding a lateral retinacular release most threatens patellar blood supply by dividing:",o:["The superior lateral genicular artery","The descending genicular artery","The middle genicular artery","The anterior tibial recurrent artery"],a:0,e:"The medial arthrotomy has already taken the medial contributions; the superior lateral genicular is the main remaining supply."},
  {q:"Vastus medialis obliquus is innervated by:",o:["The femoral nerve, entering its medial (deep) surface proximally","The obturator nerve","The saphenous nerve","The tibial nerve"],a:0,e:"Elevating the muscle from below leaves its nerve supply intact; splitting it (midvastus) may denervate a small strip."}],
 "tkr-midvastus":[
  {q:"In the midvastus approach for TKA, the VMO split runs:",o:["From the superomedial corner of the patella, obliquely in line with the VMO fibres, for about 4 cm","Along the inferior border of VMO off the intermuscular septum","Vertically through the quadriceps tendon","Lateral to the patella through the retinaculum"],a:0,e:"It is then continued distally along the medial patella and patellar tendon."},
  {q:"Which structure is left intact by both the midvastus and subvastus approaches but divided in the standard medial parapatellar arthrotomy?",o:["The quadriceps tendon","The medial retinaculum below the patella","The infrapatellar fat pad","The medial joint capsule"],a:0,e:"Sparing the quadriceps tendon is the basis of the 'quadriceps-sparing' claims for early recovery."},
  {q:"Compared with the medial parapatellar arthrotomy, randomised trials of the midvastus approach mostly show:",o:["Earlier straight-leg raise and less early pain, with similar function after the first months","Better 10-year implant survival","More frequent lateral releases","Higher infection rates"],a:0,e:"Benefits are early; long-term clinical results are equivalent."},
  {q:"EMG abnormalities in VMO after a midvastus approach have been reported in:",o:["A proportion of patients, without proven lasting clinical weakness","No patients at all","Every patient, with permanent extensor lag","Only after a quadriceps snip"],a:0,e:"Keep the split short and blunt to protect the nerve branches entering VMO medially."},
  {q:"In a muscular or heavier patient where you still want to spare the quadriceps tendon, the approach that is easier to extend is:",o:["Midvastus","Subvastus","Lateral parapatellar","Posterior"],a:0,e:"Subvastus exposure is hardest with a bulky, intact extensor mechanism."},
  {q:"A known drawback of limited 'mini' quadriceps-sparing TKA exposures is:",o:["A higher risk of component malposition and wound-edge trauma from restricted visibility","Routine need for a tibial tubercle osteotomy","More patellar tendon ruptures than the standard approach","Permanent quadriceps paralysis"],a:0,e:"Exposure should never be compromised for incision length — extend it whenever the view is inadequate."}],
 "thr-hardinge":[
  {q:"In the direct lateral (Hardinge) approach, the superior gluteal nerve is generally safe if the gluteus medius split stays within about:",o:["5 cm of the tip of the greater trochanter","1 cm of the tip","10 cm of the tip","15 cm of the tip"],a:0,e:"The inferior branch crosses roughly 5 cm above the tip (less in short patients); a stay suture at the apex prevents the split propagating."},
  {q:"The superior gluteal nerve supplies:",o:["Gluteus medius, gluteus minimus and tensor fasciae latae","Gluteus maximus","Piriformis and the gemelli","Gluteus medius only"],a:0,e:"Gluteus maximus is supplied by the inferior gluteal nerve. Injury to the superior gluteal nerve gives an abductor (Trendelenburg) limp."},
  {q:"Hardinge's direct lateral approach works because gluteus medius and vastus lateralis:",o:["Are in continuity through the thick tendinous periosteum over the anterolateral greater trochanter","Share the same nerve supply","Are separated by a true internervous plane","Both insert on the lesser trochanter"],a:0,e:"The anterior sleeve is elevated as one layer and repaired as one layer; there is no internervous plane in this approach."},
  {q:"During THR through the direct lateral approach the hip is dislocated by:",o:["External rotation and adduction with some flexion — an anterior dislocation","Flexion, adduction and internal rotation","Traction alone","Abduction and internal rotation"],a:0,e:"The posterior capsule and short external rotators are preserved, which is why dislocation rates are low compared with the posterior approach."},
  {q:"After THR through a direct lateral or anterolateral approach, the position most likely to dislocate the hip is:",o:["Extension with external rotation","Flexion beyond 90° with internal rotation","Sitting with the legs uncrossed","Hip abduction in bed"],a:0,e:"The anterior soft tissues were opened, so anterior instability is the main risk; posterior precautions apply to the posterior approach."},
  {q:"Compared with the posterior approach, the direct lateral approach for THR is classically associated with:",o:["A lower dislocation rate but more abductor weakness and limp","A higher dislocation rate and less limp","More sciatic nerve palsy","More damage to the short external rotators"],a:0,e:"Abductor dehiscence or superior gluteal nerve injury explain the limp; meticulous repair of the anterior sleeve is essential."},
  {q:"Which muscles make up the anterior sleeve elevated in the Hardinge approach?",o:["Anterior gluteus medius and gluteus minimus with the anterior vastus lateralis","Gluteus maximus and the iliotibial band","Piriformis and obturator internus","Rectus femoris and sartorius"],a:0,e:"The posterior part of gluteus medius stays attached to the trochanter to preserve the abductor lever."},
  {q:"An anterior acetabular retractor placed over the anterior wall in THR most endangers:",o:["The femoral nerve and vessels","The sciatic nerve","The superior gluteal nerve","The obturator nerve"],a:0,e:"Keep the retractor on bone deep to iliopsoas; femoral nerve palsy after THR is usually a retractor injury."}],
 dr:[
  {q:"Acceptable alignment for a distal radius fracture in an active adult includes:",o:["Radial shortening < 3 mm, dorsal tilt < 10°, articular step-off < 2 mm","Dorsal tilt up to 25°","Shortening up to 8 mm","Any step-off if the patient is right-handed"],a:0,e:"Beyond these thresholds, outcomes worsen."},
  {q:"The 'critical corner' in distal radius fractures is:",o:["The volar-ulnar (lunate facet) fragment — loss leads to volar carpal subluxation","The radial styloid","The dorsal rim","Lister's tubercle"],a:0,e:"Small plates may not capture it; consider a dedicated rim plate."},
  {q:"A 'die-punch' fragment is:",o:["A depressed lunate facet fragment","A radial styloid fracture","A DRUJ dislocation","An ulnar styloid base fracture"],a:0,e:"It disrupts both the radiocarpal and DRUJ articular surfaces."},
  {q:"Increasing numbness in the median distribution after a distal radius fracture needs:",o:["Urgent carpal tunnel release with fixation","Observation for 6 weeks","Tighter cast","Elevation only"],a:0,e:"Acute carpal tunnel syndrome is an emergency."},
  {q:"FPL rupture after volar plating is linked to:",o:["A plate prominent beyond the watershed line","Long dorsal screws","Cast immobilisation","Ulnar styloid nonunion"],a:0,e:"Long dorsal screws threaten EPL instead."},
  {q:"Ulnar variance is measured on:",o:["A neutral-rotation PA view of the wrist","A lateral view in supination","A clenched-fist view in pronation","A carpal tunnel view"],a:0,e:"Pronation and grip increase positive variance."},
  {q:"The extended FCR approach adds release of the brachioradialis insertion and pronation of the proximal fragment in order to:",o:["Reach the dorsal and intermediate-column fracture surfaces from the volar side — for malunion or comminuted, delayed fractures","Expose the median nerve in the carpal tunnel","Gain access to the DRUJ capsule","Allow plating of the ulnar styloid"],a:0,e:"Pronating the radial shaft out of the way opens the fracture like a book, so dorsal comminution can be cleared and grafted through a volar wound."},
  {q:"On a lateral wrist radiograph the teardrop angle (normally about 70°) falls below 45°. This indicates:",o:["Dorsal tilting of the volar lunate facet — the volar rim is not reduced","Normal alignment","Excess volar tilt of the whole distal fragment","Radial shortening"],a:0,e:"The teardrop is the volar rim of the lunate facet; a low teardrop angle means the lunate facet is still malreduced even if overall volar tilt looks acceptable."},
  {q:"At the wrist, extensor pollicis longus changes direction around:",o:["Lister's tubercle, in the third dorsal compartment","The radial styloid, in the first compartment","The ulnar head, in the fifth compartment","The scaphoid tubercle volarly"],a:0,e:"Its sharp turn at Lister's tubercle explains attritional EPL rupture after undisplaced fractures and from long dorsal screw tips."},
  {q:"In randomised trials of patients aged 60 or over with displaced distal radius fractures (e.g. WRIST), volar locking plates compared with casting gave:",o:["Better radiographic alignment and slightly faster early recovery, but similar function at 12 months","Clearly superior function at 12 months","Higher mortality","More complex regional pain syndrome"],a:0,e:"Older, lower-demand patients tolerate radiographic malunion well; decisions weigh function, demand and patient preference."}],
 dhs:[
  {q:"The tip–apex distance is the sum of:",o:["Tip-to-apex distances on AP and lateral views, corrected for magnification","Screw length and barrel length","AP distance only","Lateral distance only"],a:0,e:"TAD > 25 mm predicts cut-out."},
  {q:"A DHS is a poor choice for:",o:["Reverse-obliquity intertrochanteric fractures","Stable 31-A1 fractures","Two-part pertrochanteric fractures with an intact lateral wall","Elderly patients"],a:0,e:"Use an intramedullary nail; the DHS lets the shaft medialise."},
  {q:"A thin or fractured lateral femoral wall predicts:",o:["Failure of sliding hip screw fixation — prefer a nail","Better compression with a DHS","No effect","Need for hemiarthroplasty"],a:0,e:"The lateral wall buttresses the head-neck fragment."},
  {q:"The most common mechanical complication of a DHS is:",o:["Lag screw cut-out from the head","Plate breakage","Shaft fracture at the tip","Infection"],a:0,e:"Usually from varus reduction or high TAD."},
  {q:"For a basicervical fracture fixed with a sliding hip screw, add:",o:["An anti-rotation screw above the lag screw","A trochanteric stabilising plate always","A cerclage wire","Nothing"],a:0,e:"Basicervical fractures are rotationally unstable."},
  {q:"After DHS fixation in an elderly patient, weight-bearing is:",o:["As tolerated, immediately","Non-weight-bearing for 6 weeks","Toe-touch for 12 weeks","Bed rest for 2 weeks"],a:0,e:"Early mobilisation reduces mortality."},
  {q:"With a sliding hip screw, the barrel length and lag screw should leave:",o:["At least about 10 mm of screw inside the barrel after expected collapse, so it can keep sliding","The lag screw outside the barrel to allow unlimited collapse","The barrel touching the fracture line","No screw inside the barrel"],a:0,e:"Jamming (too little engagement) stops sliding and leads to cut-out; choose a short barrel for short lag screws."},
  {q:"AO/OTA 31-A1 intertrochanteric fractures are:",o:["Simple pertrochanteric fractures with an intact lateral wall","Reverse-obliquity fractures","Multifragmentary pertrochanteric fractures","Femoral neck fractures"],a:0,e:"A2 is multifragmentary pertrochanteric; A3 is intertrochanteric including reverse obliquity — the A3 group is best nailed."},
  {q:"Varus collapse after DHS fixation is best prevented by:",o:["Reducing to a neutral or slightly valgus neck-shaft angle and placing the lag screw centre-centre","Using a 150° plate in all cases","Allowing no weight-bearing","Placing the screw superiorly in the head"],a:0,e:"Varus reduction and a high tip-apex distance are the main technical causes of cut-out."},
  {q:"Excessive medialisation of the femoral shaft after DHS fixation suggests:",o:["Failure of the lateral wall, so the head-neck fragment slides without a buttress","Normal controlled collapse","Lag screw cut-out superiorly","An over-long barrel"],a:0,e:"A deficient or fractured lateral wall turns a stable pattern into an unstable one; an intramedullary device or a trochanteric stabilising plate prevents it."}],
 tibnail:[
  {q:"The most common complication after tibial nailing is:",o:["Anterior knee pain","Infection","Nonunion","Malrotation"],a:0,e:"Up to half of patients; related to the entry and the nail tip."},
  {q:"Blocking (Poller) screws are placed:",o:["On the concave side of the deformity to narrow the canal and guide the nail","On the convex side","Only distally","Across the fracture"],a:0,e:"They create a narrow canal so the nail cannot deviate."},
  {q:"An isolated tibial shaft fracture with an intact fibula tends to drift into:",o:["Varus","Valgus","Recurvatum","External rotation"],a:0,e:"The intact fibula acts as a strut."},
  {q:"Aseptic tibial nonunion after nailing is classically treated by:",o:["Exchange nailing with reaming to a larger nail","Removal and cast","Dynamisation only for atrophic nonunion","Amputation"],a:0,e:"Exchange nailing adds stability and reaming graft."},
  {q:"An advantage of suprapatellar (semi-extended) tibial nailing:",o:["Easier reduction and imaging of proximal and distal fractures","No risk to the patellofemoral cartilage","Shorter nail","No need for locking screws"],a:0,e:"The semi-extended knee relaxes the extensor pull that causes procurvatum."},
  {q:"Diastolic pressure 68 mmHg, anterior compartment pressure 42 mmHg after nailing. Next step:",o:["Four-compartment fasciotomy — ΔP is 26 mmHg","Observe — 42 is below 45","Repeat pressures tomorrow","Elevate the leg high"],a:0,e:"ΔP < 30 mmHg indicates compartment syndrome."},
  {q:"On the lateral view, the ideal tibial nail entry point lies:",o:["At the anterior edge of the tibial plateau, just behind the articular margin, in line with the canal","On the tibial tubercle","In the centre of the plateau between the spines","2 cm below the joint on the anteromedial cortex"],a:0,e:"Too distal or posterior an entry drives the nail into the posterior cortex and causes procurvatum."},
  {q:"On the AP view, the safe tibial nail entry point is:",o:["Just medial to the lateral tibial spine, in line with the medullary canal","On the medial tibial spine","Over the medial plateau","Lateral to Gerdy's tubercle"],a:0,e:"A medial entry is the classic cause of valgus malalignment in proximal-third fractures."},
  {q:"Distal tibial shaft fractures with an intact fibula, nailed without care, tend to drift into:",o:["Valgus — consider fixing the fibula or using blocking screws","Varus","Recurvatum only","Shortening only"],a:0,e:"Fibular fixation in distal-third fractures helps control alignment; blocking screws narrow the metaphyseal canal."},
  {q:"Infrapatellar nailing with a transtendinous (tendon-splitting) approach compared with suprapatellar nailing generally gives:",o:["More anterior knee pain and harder imaging and reduction of proximal fractures","Lower anterior knee pain","Easier fluoroscopy","No risk to the patellar tendon"],a:0,e:"Semi-extended suprapatellar nailing relaxes the extensor pull and keeps the leg flat for imaging."}],
 ankle:[
  {q:"Lauge-Hansen SER stage IV includes:",o:["Posterior malleolus fracture or deltoid/medial malleolus injury","Only the anterior tibiofibular ligament","A transverse fibular fracture","A proximal fibular fracture"],a:0,e:"I AITFL · II fibula · III posterior · IV medial."},
  {q:"The Weber classification is based on:",o:["The level of the fibular fracture relative to the syndesmosis","The medial malleolus pattern","Talar shift in mm","Mechanism of injury"],a:0,e:"A below, B at, C above the syndesmosis."},
  {q:"A medial clear space wider than about 4 mm on a mortise view suggests:",o:["Deltoid ligament injury with talar shift","Normal anatomy","Lateral ligament tear only","Syndesmosis is intact"],a:0,e:"Compare with the superior clear space."},
  {q:"A Maisonneuve injury is:",o:["A proximal fibular fracture with syndesmotic and medial injury","A posterior malleolus fracture","A talar dome lesion","A calcaneal avulsion"],a:0,e:"Always palpate and image the whole fibula."},
  {q:"A juvenile Tillaux fracture is an avulsion of:",o:["The anterolateral distal tibial epiphysis by the AITFL","The medial malleolus","The posterior malleolus","The fibular tip"],a:0,e:"It occurs because the physis closes medial to lateral."},
  {q:"Traditional indication to fix the posterior malleolus:",o:["Fragment > 25% of the articular surface or step-off > 2 mm (or syndesmotic instability)","Any posterior fragment","Never","Only in children"],a:0,e:"Modern practice also fixes it to stabilise the syndesmosis."},
  {q:"A Bosworth fracture-dislocation of the ankle is irreducible by closed means because:",o:["The proximal fibular fragment is trapped behind the posterolateral ridge of the tibia","The deltoid ligament is interposed","The talus is impaled on the medial malleolus","The peroneal tendons are dislocated anteriorly"],a:0,e:"Repeated closed attempts fail — it needs urgent open reduction."},
  {q:"A syndesmotic screw is placed:",o:["About 2–4 cm above the joint, parallel to the plafond, angled 20–30° from posterolateral to anteromedial","At the level of the plafond, perpendicular to the fibula","10 cm above the joint, horizontal from lateral to medial","Through the medial malleolus into the fibula"],a:0,e:"The fibula sits posterior in its incisura, so the screw must follow that angle; malreduction is common — check it directly or with CT."},
  {q:"The Haraguchi classification describes:",o:["Posterior malleolar fracture patterns on CT (posterolateral oblique, medial extension, small shell)","Talar neck fractures","Pilon fractures","Lateral ligament injuries"],a:0,e:"Type I posterolateral oblique, type II transverse medial extension, type III small shell fragments."},
  {q:"An unstable ankle fracture in a diabetic patient with peripheral neuropathy is best managed by:",o:["Augmented fixation (more or longer screws, transsyndesmotic fixation) with longer protected weight-bearing","The same fixation and early full weight-bearing","Cast alone with early weight-bearing","Primary arthrodesis in every case"],a:0,e:"Neuropathic patients have high rates of loss of fixation, wound problems and Charcot change."}],
 proxhum:[
  {q:"Hertel's predictors of humeral head ischaemia include:",o:["Metaphyseal head extension < 8 mm and medial hinge disruption > 2 mm","Neer two-part surgical neck fracture","Greater tuberosity fracture alone","Patient age over 70"],a:0,e:"Anatomic-neck patterns carry the highest risk."},
  {q:"The nerve most commonly injured with proximal humerus fractures is:",o:["Axillary nerve","Radial nerve","Musculocutaneous nerve","Suprascapular nerve"],a:0,e:"Check deltoid function and regimental badge sensation."},
  {q:"The most common complication of locking-plate fixation of the proximal humerus:",o:["Screw perforation of the joint / cut-out","Plate breakage","Infection","Radial nerve palsy"],a:0,e:"Stop head screws short and add calcar screws."},
  {q:"An elderly patient with a 4-part fracture and a deficient rotator cuff is best treated with:",o:["Reverse shoulder arthroplasty","Locking plate","Hemiarthroplasty with tuberosity repair always","K-wires"],a:0,e:"Reverse arthroplasty does not depend on tuberosity healing."},
  {q:"The main blood supply to the humeral head is now believed to be:",o:["The posterior circumflex humeral artery","The anterior circumflex alone","The suprascapular artery","The thoraco-acromial artery"],a:0,e:"Older teaching emphasised the arcuate (anterior circumflex) artery."},
  {q:"The Neer classification counts a 'part' as displaced when:",o:["Displaced > 1 cm or angulated > 45°","Displaced > 2 mm","Any fracture line is visible","Displaced > 5 mm"],a:0,e:"Neer's thresholds are 1 cm and 45°."},
  {q:"An isolated greater tuberosity fracture in an active adult is generally fixed when displaced more than about:",o:["5 mm (3 mm in overhead athletes)","1 cm only","2 cm","Any displacement at all"],a:0,e:"Superior displacement causes subacromial impingement and loss of cuff function; fix with screws or suture-bridge techniques."},
  {q:"The ProFHER trial of displaced proximal humerus fractures involving the surgical neck found that surgery compared with sling treatment gave:",o:["No significant difference in Oxford Shoulder Score at 2 years","Clearly better function with surgery","Clearly better function with sling treatment","Lower mortality with surgery"],a:0,e:"Most fractures in that trial were treated with locking plates or hemiarthroplasty; patient selection remains individual."},
  {q:"In the deltoid-split (anterolateral acromial) approach, the split of the deltoid raphe is limited distally by:",o:["The axillary nerve, about 5–7 cm below the lateral edge of the acromion","The radial nerve in the spiral groove","The musculocutaneous nerve at the coracoid","The suprascapular nerve at the spinoglenoid notch"],a:0,e:"Identify the nerve and pass the plate beneath it, or use a stay suture at the apex of the split."},
  {q:"Loss of reduction after locking-plate fixation of the proximal humerus is reduced most by:",o:["Restoring medial cortical (calcar) support, including inferomedial calcar screws","Using fewer, longer head screws","Positioning the plate high on the greater tuberosity","Leaving the head in slight varus"],a:0,e:"Gardner showed that medial support — anatomical reduction of the calcar or calcar screws — prevents varus collapse."}],
 olecranon:[
  {q:"The Mayo classification of olecranon fractures is based on:",o:["Displacement, comminution and stability of the ulnohumeral joint","Fracture line angle relative to the shaft","Distance of the fracture from the coronoid only","Patient age and bone quality"],a:0,e:"I undisplaced, II displaced but stable, III unstable; each A (non-comminuted) or B (comminuted)."},
  {q:"Tension-band wiring is a poor choice for which olecranon fracture?",o:["A comminuted fracture or one extending distal to the coronoid","A simple transverse fracture through the mid trochlear notch","A displaced transverse fracture in a young adult","A transverse fracture with a large proximal fragment"],a:0,e:"Comminuted, oblique-distal and Monteggia-type fracture-dislocations need plate fixation; compression would collapse the notch."},
  {q:"The commonest complication after olecranon tension-band wiring is:",o:["Symptomatic, prominent hardware needing removal","Non-union","Ulnar nerve palsy","Deep infection"],a:0,e:"Removal rates are high; bending and burying the K-wire hooks under triceps reduces irritation and migration."},
  {q:"The tension-band principle at the olecranon works because:",o:["The dorsal wire neutralises tension, so active elbow flexion produces compression at the articular surface","The K-wires alone compress the fracture","The wire compresses the fracture best in full extension","It holds the fracture rigidly so motion must be avoided"],a:0,e:"The dorsal (tension) side carries the wire; the anterior cortex must be intact to act as the fulcrum."},
  {q:"K-wires that protrude well beyond the anterior ulnar cortex can:",o:["Block forearm rotation and injure the anterior interosseous nerve or vessels","Cause ulnar nerve palsy at the cubital tunnel","Weaken triceps","Produce a cubitus varus"],a:0,e:"Engage the anterior cortex just distal to the coronoid, then back the wires off slightly."},
  {q:"In the cubital tunnel the ulnar nerve passes:",o:["Behind the medial epicondyle, then between the humeral and ulnar heads of FCU beneath Osborne's ligament","Through the arcade of Frohse","Anterior to the medial epicondyle with the median nerve","Between anconeus and ECU"],a:0,e:"It is the nerve at risk with medial wires, drills and retractors in posterior elbow surgery."},
  {q:"In a frail low-demand patient, excision of a comminuted olecranon fragment with triceps advancement is acceptable for up to about:",o:["50% of the articular surface, reattaching triceps close to the joint surface","10% of the articular surface only","90% of the articular surface","Any amount, as the coronoid gives stability"],a:0,e:"Larger excisions or a deficient coronoid/collateral complex make the elbow unstable."},
  {q:"For displaced isolated olecranon fractures in patients over about 75, randomised data show nonoperative treatment gives:",o:["Similar function with fewer complications, despite frequent fibrous union","Clearly worse function","A high rate of elbow instability","More wound breakdown"],a:0,e:"Most older patients tolerate fibrous union; operative fixation in this group carries many hardware and wound complications."},
  {q:"When plating a posterior Monteggia (Bado II) proximal ulna fracture, restoring the proximal ulnar dorsal angulation (PUDA) and ulnar length matters because:",o:["An ulna fixed straight or short leaves the radial head subluxed","It prevents ulnar nerve palsy","It shortens the operating time","It allows tension-band wiring instead of a plate"],a:0,e:"The proximal ulna normally angles dorsally by about 6°; a straight-contoured plate malreduces it and the radiocapitellar joint stays incongruent."},
  {q:"Over-compressing a comminuted olecranon fracture with a tension band or lag screw causes:",o:["Narrowing of the trochlear (sigmoid) notch, incongruity and loss of motion","Better stability and earlier union","Lengthening of the ulna","Radial nerve palsy"],a:0,e:"Comminution needs a bridging plate (± graft) that holds the notch at its true size, not compression."},
  {q:"Bilateral or recurrent avulsion fractures of the olecranon apophysis in a child should raise suspicion of:",o:["Osteogenesis imperfecta","Achondroplasia","Rickets","Haemophilia"],a:0,e:"Olecranon apophyseal avulsions are an otherwise uncommon injury closely associated with OI (often type I)."},
  {q:"The commonest organism in septic olecranon bursitis is:",o:["Staphylococcus aureus","Neisseria gonorrhoeae","Pseudomonas aeruginosa","Mycobacterium tuberculosis"],a:0,e:"Treat with aspiration and antibiotics; surgical bursectomy for failures — beware the thin skin over the olecranon."}],
 pedicle:[
  {q:"The classic entry point for a lumbar pedicle screw is:",o:["Junction of the mid-transverse-process line and the lateral border of the superior articular process","Centre of the lamina","Base of the spinous process","Tip of the transverse process"],a:0,e:"The mammillary process marks it; it lies just lateral to the facet joint."},
  {q:"In the lumbar spine, transverse pedicle width is generally greatest at:",o:["L5","L1","L2","L3"],a:0,e:"Width increases caudally (L1 narrowest, L5 widest); medial convergence also increases toward L5."},
  {q:"Triggered EMG stimulation of a lumbar pedicle screw elicits a response at 3 mA. This most likely means:",o:["A pedicle wall breach with the screw close to a nerve root","A normal, well-contained screw","Equipment failure only","Excellent bone density"],a:0,e:"Thresholds above about 8 mA are reassuring; below about 5 mA suggests a breach."},
  {q:"Lumbar multifidus is innervated by:",o:["The medial branch of the dorsal ramus, segmentally","The lateral branch of the dorsal ramus","The ventral rami via the lumbar plexus","The femoral nerve"],a:0,e:"Its unisegmental supply makes it vulnerable to denervation with midline subperiosteal stripping."},
  {q:"The Wiltse paraspinal approach gives the most direct access to:",o:["A far-lateral (extraforaminal) disc herniation and the pedicle entry points","The anterior disc space","The contralateral lateral recess","The sacroiliac joint anteriorly"],a:0,e:"It runs between multifidus and longissimus onto the facet and transverse process."},
  {q:"Postoperative visual loss after prone spine surgery is most often due to:",o:["Ischaemic optic neuropathy","Central retinal artery occlusion from direct pressure in most cases","Cortical blindness","Corneal abrasion"],a:0,e:"Risk factors: long prone surgery, large blood loss, anaemia, hypotension and obesity."},
  {q:"After an L4–L5 fusion, adjacent segment degeneration most commonly develops:",o:["At the level above the fusion (L3–L4)","At the level below the fusion","Only at the fused level","In the thoracic spine"],a:0,e:"The cranial adjacent level takes most of the increased motion and stress."},
  {q:"Pedicle screw pull-out strength depends mostly on:",o:["The screw's major (outer) diameter and the bone mineral density","The rod diameter","The tulip-head design","The screw colour coding"],a:0,e:"Cement augmentation or larger screws help in osteoporotic bone."},
  {q:"Compared with a traditional lumbar pedicle screw, a cortical bone trajectory (CBT) screw:",o:["Starts on the pars and runs medial-to-lateral and caudal-to-cranial, gaining purchase in denser cortical bone","Starts on the transverse process and converges medially","Runs straight anterior through the facet joint","Is only used in the cervical spine"],a:0,e:"CBT needs less lateral muscle dissection and suits osteoporotic bone; the entry is more medial and caudal than the TP–SAP junction."},
  {q:"A true AP fluoroscopic view of a lumbar vertebra for pedicle cannulation shows:",o:["The spinous process midway between the pedicles and the superior endplate as a single line","The spinous process over one pedicle","A double-contoured endplate","The pedicles foreshortened to slits"],a:0,e:"Adjust the C-arm tilt for each level's lordosis; a rotated view misjudges medial breaches."},
  {q:"A new foot drop after L4–L5 pedicle screw fixation, with CT showing a medially placed L5 screw, should be managed by:",o:["Urgent return to theatre to remove or redirect the screw and explore the root","Observation for 6 weeks","Steroids alone","Physiotherapy and an ankle–foot orthosis only"],a:0,e:"A new deficit with a misplaced screw is decompressed promptly; the outcome is better the earlier the root is freed."},
  {q:"Harvesting posterior iliac crest graft more than about 8 cm lateral to the PSIS risks:",o:["The superior cluneal nerves crossing the crest (buttock numbness and pain)","The sciatic nerve","The superior gluteal artery in every case","The lateral femoral cutaneous nerve"],a:0,e:"Staying close to the PSIS protects the cluneal nerves; deep in the sciatic notch the superior gluteal vessels are at risk."}],
 radshaft:[
  {q:"In Galeazzi fractures, the radial shaft fracture most often associated with DRUJ instability lies:",o:["Within about 7.5 cm of the mid-articular surface of the distal radius","More than 10 cm from the wrist","In the proximal third","At the radial tuberosity"],a:0,e:"Rettig and Raskin found DRUJ instability in over half of distal (within 7.5 cm) fractures but few proximal ones — check the DRUJ after every radial shaft fixation."},
  {q:"A patient cannot extend the fingers or thumb after radial shaft surgery but can still extend the wrist, which deviates radially. The lesion is:",o:["Posterior interosseous nerve palsy — ECRL (supplied above the elbow) is spared, ECU is lost","Radial nerve palsy in the spiral groove","Median nerve palsy","Superficial radial nerve neuroma"],a:0,e:"A spiral-groove radial nerve palsy also causes wrist drop and loss of sensation over the first web space."},
  {q:"A simple oblique forearm shaft fracture with a butterfly fragment is fixed for absolute stability by:",o:["An interfragmentary lag screw (through or outside the plate) protected by a neutralisation plate","Bridge plating without reduction","A single cerclage wire","An external fixator"],a:0,e:"Lag screws compress the fragments; the plate neutralises bending and torsion. Bridge plating is for multifragmentary zones."},
  {q:"For Gustilo I–IIIA open forearm shaft fractures, current practice is:",o:["Thorough debridement with immediate plate fixation, with infection rates similar to closed fractures","Delayed fixation after 6 weeks in an external fixator for all","Cast immobilisation only","Intramedullary K-wires only"],a:0,e:"Early antibiotics and debridement matter most; immediate internal fixation is safe after adequate debridement."},
  {q:"For a displaced adult radial or both-bone forearm shaft fracture, standard plate fixation uses:",o:["3.5 mm compression plates with at least six cortices (three bicortical screws) on each side of the fracture","2.7 mm plates with four cortices each side","One-third tubular plates","Elastic stable intramedullary nails as for children"],a:0,e:"Absolute stability with interfragmentary compression gives union rates above 95% in simple patterns."},
  {q:"Schemitsch and Richards related functional outcome after forearm shaft plating to restoration of:",o:["The magnitude and location of the maximum radial bow","Ulnar length only","The interosseous membrane width at the wrist","Radial head height"],a:0,e:"Restoring the bow to within a few millimetres of normal preserved rotation and grip strength."},
  {q:"After plating a distal-third radial shaft fracture, the DRUJ is unstable but reduces in supination. Usual management:",o:["Immobilise in supination (above elbow) for about 4–6 weeks, or transfix the DRUJ with K-wires in supination","Ignore it — it will stabilise","Excise the ulnar head","Immediate DRUJ arthrodesis"],a:0,e:"An irreducible DRUJ suggests interposed ECU or soft tissue and needs open reduction."},
  {q:"Radioulnar synostosis after forearm fixation is most associated with:",o:["Exposing both bones through a single incision, high-energy injury and associated head injury","Using separate incisions for radius and ulna","Early active motion","Locking screws"],a:0,e:"Use separate Henry/Thompson and subcutaneous ulnar incisions and avoid graft or screws in the interosseous membrane."},
  {q:"An isolated ulnar shaft ('nightstick') fracture can usually be treated nonoperatively when:",o:["Displacement is under 50% and angulation under about 10°, with no radioulnar joint injury","Displacement is over 50%","It is in the proximal third with radial head dislocation","There is any angulation at all"],a:0,e:"A proximal ulnar fracture with a dislocated radial head is a Monteggia lesion and needs fixation."},
  {q:"In the proximal third of the Henry approach the posterior interosseous nerve is protected by:",o:["Full supination and subperiosteal release of supinator from its insertion, reflected laterally","Full pronation and splitting supinator","Placing a Hohmann retractor around the radial neck","Dividing the arcade of Frohse routinely"],a:0,e:"Supination brings the supinator insertion anterior and carries the nerve away laterally inside the muscle."},
  {q:"The 'leash of Henry' refers to:",o:["Branches of the radial recurrent vessels crossing the field near the radial neck — ligated in the Henry approach and a cause of PIN compression","The arcade of Frohse","The lacertus fibrosus","Struthers' ligament"],a:0,e:"It lies in the radial tunnel; ligating it lets brachioradialis and the radial artery be mobilised."},
  {q:"Refracture after removal of a forearm plate is reduced by:",o:["Not removing it routinely, or waiting at least about 12–18 months and protecting the arm for some weeks afterwards","Removing it at 3 months","Removing it through a smaller incision","Replacing it with a cast for 2 weeks only"],a:0,e:"Screw holes and cortical osteopenia under the plate weaken the bone; most plates are left in situ unless symptomatic."}],
 "thr-daa":[
  {q:"The superficial internervous plane of the direct anterior approach to the hip lies between:",o:["Tensor fasciae latae (superior gluteal n.) and sartorius (femoral n.)","Gluteus medius and TFL","Gluteus maximus fibres","Adductor longus and gracilis"],a:0,e:"Working inside the TFL sheath keeps the lateral femoral cutaneous nerve, which crosses sartorius, medial and protected."},
  {q:"The commonest nerve complication of the direct anterior approach for THR is:",o:["Lateral femoral cutaneous nerve neurapraxia (anterolateral thigh numbness)","Sciatic nerve palsy","Femoral nerve palsy","Superior gluteal nerve palsy"],a:0,e:"Reported in a large minority of patients; most symptoms improve, and starting the incision lateral to the ASIS reduces it."},
  {q:"The vessel that crosses the deep interval of the anterior hip approach and must be ligated is:",o:["The ascending branch of the lateral femoral circumflex artery","The medial femoral circumflex artery","The superior gluteal artery","The obturator artery"],a:0,e:"It runs across the anterior capsule at the base of the neck between rectus femoris and gluteus medius."},
  {q:"To deliver the femur for broaching in the direct anterior approach, the leg is placed in:",o:["Hyperextension, adduction and external rotation, with progressive posterosuperior capsular release","Flexion, adduction and internal rotation","Abduction and internal rotation","Neutral with axial traction"],a:0,e:"Insufficient release with forceful levering is how trochanteric and calcar fractures happen."},
  {q:"An advantage of the supine position for the direct anterior approach is:",o:["Intraoperative AP fluoroscopy and direct comparison of leg lengths","No need for any capsulotomy","A lower risk of femoral fracture than all other approaches","Easier access for revision of femoral stems"],a:0,e:"Femoral exposure is harder and the learning curve steep; extensile options are more limited than posteriorly."},
  {q:"After THR through a direct anterior approach, the position that most risks dislocation is:",o:["Extension with external rotation","Deep flexion with internal rotation","Sitting with legs uncrossed","Abduction"],a:0,e:"The anterior capsule is opened while the posterior capsule and short rotators are preserved, so instability is anterior."},
  {q:"A wound complication particularly associated with the direct anterior approach is:",o:["Delayed healing or infection in obese patients with a pannus overhanging the groin crease","Abductor dehiscence","Posterior thigh haematoma compressing the sciatic nerve","Heterotopic bone in gluteus maximus"],a:0,e:"A large pannus over the incision keeps it moist; consider another approach or careful patient selection."}],
 acl:[
  {q:"In an acute ACL rupture, the meniscus most often torn at the same time is:",o:["The lateral meniscus","The medial meniscus","Both equally","Neither — meniscal tears only occur in chronic ACL deficiency"],a:0,e:"Acute injuries favour lateral tears (often posterior root/horn); in chronic ACL-deficient knees the medial meniscus (posterior horn, the secondary restraint) tears more often."},
  {q:"Arthroscopically, the femoral ACL footprint lies:",o:["Posterior (deep) and inferior to the lateral intercondylar (resident's) ridge on the medial wall of the lateral femoral condyle, with the bifurcate ridge between the AM and PL bundles","Anterior to the resident's ridge on the notch roof","On the lateral wall of the medial femoral condyle","At the top of the notch at 12 o'clock"],a:0,e:"The resident's ridge marks the anterior limit of the footprint; 'over-the-top' and 12 o'clock positions are non-anatomic."},
  {q:"Drilling the femoral tunnel through a standard tibial tunnel (transtibial) tends to produce:",o:["A high, vertical femoral tunnel that controls anterior translation but not rotation (persistent pivot shift)","An over-horizontal graft with roof impingement","Posterior wall blow-out in every case","An anatomic tunnel identical to AM-portal drilling"],a:0,e:"The tibial tunnel constrains the femoral guide — independent (AM portal or outside-in) drilling gives a more anatomic footprint."},
  {q:"Hamstring autograft diameter is linked to revision risk. The threshold commonly quoted is:",o:["Less than 8 mm — higher revision rates, especially in patients under 20","Less than 12 mm","Less than 5 mm only","Diameter has no effect"],a:0,e:"Options for a small graft: 5- or 6-strand configurations, augmentation, or a different graft (BPTB or quadriceps tendon)."},
  {q:"A cyclops lesion after ACL reconstruction presents with:",o:["Loss of terminal extension with a painful clunk — a fibroproliferative nodule anterior to the graft","Recurrent giving way in pivoting","Medial joint-line pain on squatting","Patellar instability"],a:0,e:"It is linked to an anteriorly placed tibial tunnel and graft debris; treatment is arthroscopic excision."},
  {q:"The most common technical cause of ACL graft failure is:",o:["Femoral tunnel malposition, usually too anterior or vertical","Using a hamstring rather than a patellar tendon graft","Interference-screw fixation","Fixing the graft in full extension"],a:0,e:"Tunnel malposition dominates technical failures; trauma and biological failure account for most of the rest."},
  {q:"The commonest complication of hamstring tendon harvest is:",o:["Numbness from injury to the infrapatellar branch of the saphenous nerve","Saphenous vein thrombosis","MCL injury","Patellar tendon rupture"],a:0,e:"A more oblique or horizontal harvest incision and careful dissection reduce it; most patients adapt."},
  {q:"In a high-risk young patient (generalised laxity, high-grade pivot shift, return to pivoting sport), adding a lateral extra-articular tenodesis to hamstring ACL reconstruction has been shown to:",o:["Reduce graft rupture and persistent rotatory instability (STABILITY trial)","Increase graft failure","Have no effect on failure","Replace the need for an intra-articular graft"],a:0,e:"The modified Lemaire tenodesis uses a strip of iliotibial band passed under the LCL to the femur."},
  {q:"Compared with a hamstring autograft, a bone–patellar tendon–bone autograft for ACL reconstruction has a higher rate of:",o:["Anterior knee pain and pain on kneeling","Tunnel widening","Graft rupture in all age groups","Saphenous nerve injury"],a:0,e:"BPTB gives bone-to-bone healing; donor-site morbidity (kneeling pain, rarely patellar fracture or tendon rupture) is its main drawback."},
  {q:"The centre of the anatomic tibial ACL footprint lies:",o:["Between the tibial spines, in line with the posterior border of the anterior horn of the lateral meniscus","At the posterior edge of the plateau next to the PCL","On the anterior tibial cortex below the joint line","On the medial tibial spine apex"],a:0,e:"A tibial tunnel placed too anteriorly causes roof impingement and a cyclops lesion; too posteriorly gives a vertical graft."},
  {q:"After a free tendon graft is implanted it remodels (ligamentisation). It is mechanically weakest at about:",o:["6–12 weeks after surgery, during necrosis and revascularisation","The day of surgery","1 year","2 years"],a:0,e:"This underpins the protection of the graft from high loads in the early rehabilitation phase."},
  {q:"The most effective way to reduce arthrofibrosis after ACL reconstruction is:",o:["Delaying surgery until the knee has full extension, little swelling and good quadriceps control (prehabilitation)","Reconstructing within 24 hours of injury","Immobilising the knee in flexion for 6 weeks","Using an allograft"],a:0,e:"Operating on a stiff, swollen knee and anterior tunnel placement predispose to loss of extension."}],
 "ankle-pl":[
  {q:"The posterior malleolar fragment of the distal tibia is also known as:",o:["Volkmann's triangle (fragment)","The Tillaux–Chaput tubercle","Wagstaffe's fragment","The Lisfranc fragment"],a:0,e:"Tillaux–Chaput is the anterolateral tibial tubercle (AITFL); Wagstaffe–Le Fort is the anterior fibular tubercle avulsion."},
  {q:"An advantage of the posterolateral ankle approach is that through one incision you can:",o:["Fix the posterior malleolus and plate the fibula posteriorly","Fix the medial malleolus and the posterior malleolus","Repair the deltoid ligament","Reach the talar neck"],a:0,e:"The fibula is reached by working lateral to the peroneal tendons; the posterior tibia by working in the peronei–FHL interval."},
  {q:"A posterior malleolar fracture that extends to the medial malleolus (posteromedial fragment) is best reached through:",o:["A posteromedial approach (between tibialis posterior/FDL and the neurovascular bundle, or behind the bundle)","The posterolateral approach only","An anterolateral approach","An anterior approach between TA and EHL"],a:0,e:"The posterolateral window cannot reach a fragment that extends medially; posteromedial approaches protect the tibial nerve and posterior tibial artery."},
  {q:"Extending the posterolateral ankle approach proximally, the artery lying deep to FHL near the fibula that can be injured is the:",o:["Peroneal artery","Anterior tibial artery","Dorsalis pedis artery","Medial plantar artery"],a:0,e:"FHL is elevated off the posterior tibia from lateral to medial; the peroneal vessels run deep to it near the fibula and send perforators that must be controlled."},
  {q:"The posterolateral approach to the ankle uses the internervous plane between:",o:["Peroneus longus and brevis (superficial peroneal n.) and flexor hallucis longus (tibial n.)","Tibialis anterior and extensor hallucis longus","FHL and flexor digitorum longus","The Achilles tendon and FHL"],a:0,e:"FHL is elevated from the posterior fibula and tibia and retracted medially, exposing the posterolateral tibia and posterior fibula."},
  {q:"The nerve most at risk in the superficial dissection of the posterolateral ankle approach is:",o:["The sural nerve, running with the small saphenous vein","The superficial peroneal nerve","The saphenous nerve","The deep peroneal nerve"],a:0,e:"Its course crosses the line of the incision obliquely; sural neuritis is a recognised complication."},
  {q:"During the posterolateral approach, the posterior tibial artery and tibial nerve are protected by:",o:["Keeping FHL between the dissection and the bundle and retracting it medially","Retracting the peroneal tendons medially","Detaching the Achilles tendon","Working medial to FHL"],a:0,e:"The neurovascular bundle lies between FHL and FDL — dissection medial to FHL endangers it."},
  {q:"Direct fixation of a posterior malleolar fragment improves syndesmotic stability because the fragment carries:",o:["The posterior inferior tibiofibular ligament (PITFL)","The anterior inferior tibiofibular ligament","The deltoid ligament","The interosseous membrane only"],a:0,e:"Anatomical reduction restores the posterior incisura and PITFL tension, often avoiding a syndesmotic screw."},
  {q:"The Bartoníček–Rammelt classification describes:",o:["Posterior malleolar fractures on CT, by size, position and involvement of the fibular notch","Pilon fractures by comminution","Talar neck fractures by displacement","Lateral ankle ligament injuries"],a:0,e:"Type 1 extraincisural, 2 posterolateral, 3 posteromedial two-part, 4 large posterolateral triangular, 5 irregular osteoporotic."},
  {q:"A posteriorly placed (antiglide) plate on a Weber B fibula fracture:",o:["Resists the proximal-posterior displacement of the distal fragment, but placed too distally it irritates the peroneal tendons","Is weaker than a lateral neutralisation plate","Cannot be used with a lag screw","Must always be removed"],a:0,e:"It buttresses the apex of the oblique SER fracture; keep the distal end out of the peroneal groove."}],
 "proxhum-delt":[
  {q:"In the deltoid-split approach, the split is made through:",o:["The raphe between the anterior and middle heads, starting at the anterolateral corner of the acromion","The deltopectoral groove","The middle of the posterior deltoid","The deltoid insertion on the humerus"],a:0,e:"The raphe is relatively avascular and lies directly over the greater tuberosity and lateral humerus."},
  {q:"On the deep surface of the deltoid, the axillary nerve runs:",o:["Horizontally from posterior to anterior around the surgical neck, with the posterior circumflex humeral vessels","Vertically down the anterior deltoid","Within the deltopectoral groove","Through the rotator interval"],a:0,e:"It emerges from the quadrangular space and wraps around the humerus about 5–7 cm below the acromion."},
  {q:"Division of the axillary nerve distal to a deltoid split most specifically weakens:",o:["The anterior deltoid (anterior to the split), affecting forward elevation","The supraspinatus","The teres major","The long head of biceps"],a:0,e:"The anterior branch supplies the anterior and middle deltoid from behind; a split carried too far distally cuts the fibres anterior to it off from their nerve."},
  {q:"In minimally invasive (MIPO) proximal humeral plating through a deltoid split:",o:["The plate is slid beneath the axillary nerve, with head screws through the proximal window and shaft screws through a separate distal window","The nerve is mobilised and transposed over the plate","The split is carried down to the deltoid tuberosity","The plate is placed over the bicipital groove"],a:0,e:"The nerve lies against the plate between the windows; some plates have a dedicated nerve-safe zone without holes."},
  {q:"A fracture pattern better approached through the deltopectoral than the deltoid-split route is:",o:["A head-split or anatomical-neck fracture that may need arthroplasty","An isolated displaced greater tuberosity fracture","A two-part surgical-neck fracture for MIPO plating","A valgus-impacted fracture needing lateral buttress"],a:0,e:"The deltopectoral approach is extensile and gives access to the joint, the lesser tuberosity and the glenoid."},
