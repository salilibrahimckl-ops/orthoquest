<style>
/* Layout: one-screen game shell — sticky HUD on top, scrolling stage, bottom mode bar. Lightbox-slate world, gentian-violet skin-marker accent. */
:root{
  --bg:#0E151E; --panel:#151F2B; --panel2:#1B2836; --line:#2A3A4D;
  --fg:#E7EDF3; --muted:#8E9DAF; --bone:#EDE3CF;
  --accent:#A274FF; --accent-ink:#140A26; --accent-soft:rgba(162,116,255,.16);
  --ok:#3CC896; --bad:#FF6B6B; --warn:#F2B14B;
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.hud{flex:none;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.logo b{color:var(--build,var(--accent))}
.logo small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--build,var(--muted));opacity:.85;margin-top:-2px}
.newcard{border-color:var(--build,var(--accent));display:flex;flex-direction:column;gap:8px}
.newcard .row{justify-content:space-between;flex-wrap:nowrap}
.hud .rank{margin-left:auto;text-align:right;min-width:0}
.rank small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rank span{font-family:var(--display);font-weight:600;font-size:14px}
.xpbar{height:4px;width:120px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--build,var(--accent));width:0;transition:width .5s}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.view.full{max-width:1100px}
nav.bar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bar button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current="page"]{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode .tag{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.mode p{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:12px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border:2px dashed var(--accent);border-radius:50%;opacity:.25}
.hero .badge{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 18px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Atlas */
.stage{position:relative;height:min(58vh,520px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 40%,#1A2838 0%,var(--bg) 75%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hint{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
.stage .tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.stage .tools button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(21,31,43,.85);display:grid;place-items:center}
.stage .tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stage .label{position:absolute;left:12px;top:10px;font-family:var(--display);font-weight:600;font-size:15px;background:rgba(14,21,30,.8);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.facts li{max-width:65ch}
.facts li::marker{color:var(--accent)}
.aplist{display:flex;flex-direction:column;gap:8px}
.ap{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ap small{display:block;color:var(--muted);font-size:12px}
.ap .go{font-family:var(--mono);font-size:12px;color:var(--accent);flex:none}
/* Sim */
.monitor{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#08110D;border:1px solid #1D3A2E;border-radius:10px;padding:10px 12px}
.monitor canvas{width:100%;height:44px;display:block}
.vitals{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono)}
.vitals .hr{font-size:22px;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1}
.vitals .hr.alarm{color:var(--bad)}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--ok)}
.pips i.off{background:#24342C}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--warn);width:100%}
.step-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prompt{font-size:17px;font-weight:600;line-height:1.4;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(60,200,150,.1)}
.opt.ok .k{background:var(--ok);color:#06231A}
.opt.bad{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.bad .k{background:var(--bad);color:#2A0808}
.opt:disabled{cursor:default}
.fb{border-left:3px solid var(--ok);background:var(--panel2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;max-width:65ch}
.fb.bad{border-left-color:var(--bad)}
.fb b{font-family:var(--display)}
.vignette{font-size:15px;background:var(--panel2);border-radius:8px;padding:14px;border:1px dashed var(--line);max-width:70ch}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 16px}
.stars{font-size:34px;letter-spacing:6px;color:var(--warn)}
.stars .dim{color:var(--line)}
.big{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;font-family:var(--display);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.apcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.apcard:hover{border-color:var(--accent)}
.apcard .plane{font-size:13px;color:var(--muted)}
.apcard .best{font-family:var(--mono);font-size:12px;color:var(--warn)}
.tagline{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}.xpbar{width:90px}}
.stage.or{height:min(56vh,560px)}
.orhud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 64px);pointer-events:none}
.orhud span{font-family:var(--mono);font-size:11px;background:rgba(8,17,13,.85);border:1px solid #1D3A2E;color:#8FCDB4;padding:3px 7px;border-radius:6px;display:inline-flex;gap:5px;align-items:center}
.orhud b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.orhud b.alarm{color:var(--bad)}
.stage .phase{position:absolute;left:10px;bottom:10px;right:56px;font-family:var(--display);font-weight:600;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
.stage.fluoro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(0,0,0,.88) 71%)}
.stage.fluoro .phase{color:#fff}
.stage .tools{z-index:2}
.stage .tools button svg{width:18px;height:18px}
.stage.scalpel canvas{cursor:crosshair}
.timeline{display:flex;gap:4px}
.timeline i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.timeline i.done{background:var(--ok)}.timeline i.cur{background:var(--accent)}.timeline i.err{background:var(--warn)}
.layers{display:flex;gap:8px;flex-wrap:wrap}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kind{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.proc{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.proc .row .btn{padding:8px 12px}
.sbar{position:absolute;left:10px;right:58px;bottom:10px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:rgba(14,21,30,.9);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:2}
.sbar .sbt{min-width:0;display:flex;flex-direction:column;font-size:12px;line-height:1.3}
.sbar .sbt b{font-family:var(--display);font-size:14px}
.sbar .sbt span{color:var(--muted)}
.sbar.ok{border-color:var(--ok)}.sbar.ok b{color:var(--ok)}.sbar.bad{border-color:var(--bad)}.sbar.bad b{color:var(--bad)}
.sbar .btn{padding:8px 12px;flex:none}
.fb.hint{border-left-color:var(--accent)}
.apchips{display:flex;flex-wrap:wrap;gap:6px}
.apchips .chip{padding:5px 11px;font-size:12px;white-space:normal;text-align:left;line-height:1.3}
.apchips .chip.soon{opacity:.55;border-style:dashed;font-weight:500}
.loadmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(14,21,30,.9);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:12px;text-align:center;max-width:80%}
</style>

<script>
/* ================= BUILD MARKER (bump n, hue +137, date and news on every publish) ================= */
const BUILD={n:10,hue:323,date:"25 Oct 2026, 23:46 IST",news:["New approach: Ankle fracture fixation through the posterolateral approach (prone) — sural nerve, peroneal/FHL interval, posterior malleolus buttress plate and posterior fibular plate through one incision (10 steps)", "6 new post-op viva questions for the posterolateral ankle approach"]};
try{document.documentElement.style.setProperty("--build",`hsl(${BUILD.hue},75%,65%)`)}catch(e){}
/* ================= CONTENT ================= */
const REGIONS={
 shoulder:{name:"Shoulder girdle",facts:[
  "Rotator interval: between supraspinatus and subscapularis; contains coracohumeral ligament, SGHL and the long head of biceps.",
  "Axillary nerve exits the quadrangular space (teres minor, teres major, long head triceps, humeral neck) and runs ~5 cm below the acromion.",
  "Bankart lesion = anteroinferior labral avulsion; Hill-Sachs = posterolateral humeral head impaction.",
  "Neer classification of proximal humerus fractures counts parts displaced >1 cm or angulated >45°.",
  "Suprascapular nerve: under the superior transverse scapular ligament (supraspinatus + infraspinatus) and spinoglenoid notch (infraspinatus only)."],aps:["deltopectoral"]},
 arm:{name:"Humerus shaft",facts:[
  "Radial nerve runs in the spiral groove with the profunda brachii artery.",
  "Holstein-Lewis fracture: spiral distal-third humeral shaft fracture with radial nerve entrapment risk.",
  "Acceptable closed alignment: up to 20° anterior angulation, 30° varus, 3 cm shortening (functional brace).",

 elbow:{name:"Elbow",facts:[
  "Terrible triad: posterior dislocation + radial head fracture + coronoid fracture.",
  "LUCL is the key restraint to posterolateral rotatory instability; test with the pivot-shift (lateral) test.",
  "Ossification order CRITOE: capitellum 1, radial head 3, internal epicondyle 5, trochlea 7, olecranon 9, external epicondyle 11 yrs (approx.).",

 forearm:{name:"Forearm",facts:[
  "Monteggia: proximal ulna fracture + radial head dislocation; Bado I (anterior) most common; PIN most often affected.",

 hand:{name:"Wrist & hand",facts:[
  "Scaphoid blood supply is retrograde (dorsal carpal branch of the radial artery) — proximal pole AVN risk.",
  "Dorsal compartments: 1 APL/EPB, 2 ECRL/ECRB, 3 EPL, 4 EDC/EIP, 5 EDM, 6 ECU.",

 spine:{name:"Spine",facts:[
  "Denis middle column: posterior vertebral body, posterior annulus and PLL.",

 pelvis:{name:"Pelvis & acetabulum",facts:[

  "Corona mortis: anastomosis between obturator and external iliac/inferior epigastric vessels behind the superior ramus."],aps:["kl"]},
 hip:{name:"Hip & proximal femur",facts:[
  "Femoral head supply in adults: mainly the deep branch of the MFCA (lateral epiphyseal arteries).",

  "SCFE: epiphysis slips posteriorly and medially; Klein's line fails to intersect the epiphysis on AP."],aps:["smithpetersen","kl"]},
 thigh:{name:"Femoral shaft",facts:[
  "Winquist-Hansen grades comminution of femoral shaft fractures.",
  "Ipsilateral femoral neck fracture occurs in ~2–9% of shaft fractures — often missed; get dedicated hip imaging.",
  "Reamed antegrade IM nailing is the standard for adult shaft fractures.",
  "Fat embolism syndrome: Gurd criteria — respiratory insufficiency, cerebral signs, petechiae (axilla, conjunctiva)."],aps:[]},
 knee:{name:"Knee",facts:[
  "Segond fracture: lateral tibial rim avulsion (anterolateral ligament) — strongly associated with ACL tear.",

 leg:{name:"Tibia & fibula",facts:[
  "Gustilo-Anderson IIIB: open fracture with periosteal stripping needing flap cover; IIIC: arterial injury needing repair.",

const RANKS=[[0,"Intern"],[500,"Junior Resident"],[1500,"Senior Resident"],[3500,"Registrar"],[7000,"Fellow"],[12000,"Consultant"],[20000,"Professor"]];

/* ================= STATE ================= */
const KEY="orthoquest.v1";
function defState(){return{xp:0,ans:0,cor:0,best:0,wrong:[],ap:{},cases:{},or:{},opq:{}}}
let S=defState();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(defState(),JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k});return i}
function addXP(n){const before=rankOf(S.xp);S.xp+=n;save();hud();if(rankOf(S.xp)>before)toast("Promoted: "+RANKS[rankOf(S.xp)][1]);}
function hud(){const i=rankOf(S.xp),lo=RANKS[i][0],hi=RANKS[i+1]?RANKS[i+1][0]:lo+1;
 document.getElementById("hudXp").textContent=S.xp.toLocaleString()+" XP";
 document.getElementById("hudRank").textContent=RANKS[i][1];
 document.getElementById("hudBar").style.width=(RANKS[i+1]?Math.min(100,(S.xp-lo)/(hi-lo)*100):100)+"%";}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
const $m=document.getElementById("main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function splitBone(c,id,n,pt,pv){const m=c.o[id];clipAdd(m,new THREE.Plane().setFromNormalAndCoplanarPoint(new THREE.Vector3(...n).normalize(),c.W(pt)));

function famOf(p){return FAMILIES.find(f=>f.aps.some(a=>a.p===p.id))||FAMILIES.find(f=>f.id===p.family)||null}
function famList(){const out=[],seen=new Set();PROCS.forEach(p=>{const f=famOf(p);const key=f?f.id:"_"+p.id;if(seen.has(key))return;seen.add(key);
  if(f){const aps=f.aps.map(a=>({n:a.n,d:a.d||"",proc:a.p?PROCS.find(q=>q.id===a.p)||null:null}));PROCS.filter(q=>q.family===f.id&&!aps.some(a=>a.proc===q)).forEach(q=>aps.push({n:q.apName||q.approach,d:"",proc:q}));out.push({id:f.id,name:f.name,aps})}
  else out.push({id:"_"+p.id,name:p.name,aps:[{n:p.apName||p.approach,d:"",proc:p}]})});return out}
PROCS.forEach(p=>{const f=famOf(p);if(f){p.family=p.family||f.id;const a=f.aps.find(x=>x.p===p.id);if(a&&!p.apName)p.apName=a.n}});

 tkr:[

  {q:"During cruciate-retaining TKA trialling, the tibial trial lifts off anteriorly in deep flexion. This indicates:",o:["A tight PCL (tight flexion gap) — recess the PCL or add posterior slope","A loose MCL","Patellar maltracking","An oversized tibial tray"],a:0,e:"Excess rollback from a tight PCL also accelerates posterior polyethylene wear."},

 nail:[

  {q:"Compared with unreamed nailing, reamed femoral nailing gives:",o:["Higher union rates","More nonunion","No difference in union","More infection in closed fractures"],a:0,e:"Reaming allows a larger nail and adds autograft at the fracture."},
  {q:"Rotation after femoral nailing is best checked by:",o:["Comparing the lesser trochanter profile with the other side (or CT if unsure)","AP view of the knee only","Leg length alone","Palpating the greater trochanter"],a:0,e:"Malrotation over 15° is poorly tolerated."},
  {q:"With a piriformis-entry antegrade femoral nail, a starting point that is too anterior risks:",o:["Iatrogenic comminution (bursting) of the proximal femur from hoop stresses","Varus malalignment only","Injury to the femoral nerve","Distal anterior cortical perforation only"],a:0,e:"An anterior start creates high hoop stresses in the proximal fragment; aim in line with the canal on both views."},

 "tkr-subvastus":[
  {q:"The main anatomical advantage of the subvastus approach for TKA is that it:",o:["Leaves the quadriceps tendon and the VMO insertion on the patella intact","Gives the widest exposure in obese knees","Avoids the infrapatellar branch of the saphenous nerve","Allows routine patellar eversion"],a:0,e:"Trials show less early pain and faster straight-leg raise; long-term function is similar to medial parapatellar."},

  {q:"The midvastus approach differs from the subvastus approach because it:",o:["Splits VMO in line with its fibres from the superomedial pole of the patella","Lifts VMO from its inferior border off the septum","Incises the quadriceps tendon in the midline","Goes lateral to the patella"],a:0,e:"Both spare the quadriceps tendon; midvastus is easier to extend in bigger knees."},

 "tkr-midvastus":[

 "thr-hardinge":[

 dr:[

  {q:"A Maisonneuve injury is:",o:["A proximal fibular fracture with syndesmotic and medial injury","A posterior malleolus fracture","A talar dome lesion","A calcaneal avulsion"],a:0,e:"Always palpate and image the whole fibula."},
  {q:"A juvenile Tillaux fracture is an avulsion of:",o:["The anterolateral distal tibial epiphysis by the AITFL","The medial malleolus","The posterior malleolus","The fibular tip"],a:0,e:"It occurs because the physis closes medial to lateral."},
  {q:"Traditional indication to fix the posterior malleolus:",o:["Fragment > 25% of the articular surface or step-off > 2 mm (or syndesmotic instability)","Any posterior fragment","Never","Only in children"],a:0,e:"Modern practice also fixes it to stabilise the syndesmosis."},
  {q:"A Bosworth fracture-dislocation of the ankle is irreducible by closed means because:",o:["The proximal fibular fragment is trapped behind the posterolateral ridge of the tibia","The deltoid ligament is interposed","The talus is impaled on the medial malleolus","The peroneal tendons are dislocated anteriorly"],a:0,e:"Repeated closed attempts fail — it needs urgent open reduction."},
  {q:"A syndesmotic screw is placed:",o:["About 2–4 cm above the joint, parallel to the plafond, angled 20–30° from posterolateral to anteromedial","At the level of the plafond, perpendicular to the fibula","10 cm above the joint, horizontal from lateral to medial","Through the medial malleolus into the fibula"],a:0,e:"The fibula sits posterior in its incisura, so the screw must follow that angle; malreduction is common — check it directly or with CT."},
  {q:"The Haraguchi classification describes:",o:["Posterior malleolar fracture patterns on CT (posterolateral oblique, medial extension, small shell)","Talar neck fractures","Pilon fractures","Lateral ligament injuries"],a:0,e:"Type I posterolateral oblique, type II transverse medial extension, type III small shell fragments."},
  {q:"An unstable ankle fracture in a diabetic patient with peripheral neuropathy is best managed by:",o:["Augmented fixation (more or longer screws, transsyndesmotic fixation) with longer protected weight-bearing","The same fixation and early full weight-bearing","Cast alone with early weight-bearing","Primary arthrodesis in every case"],a:0,e:"Neuropathic patients have high rates of loss of fixation, wound problems and Charcot change."}],
 proxhum:[
  {q:"Hertel's predictors of humeral head ischaemia include:",o:["Metaphyseal head extension < 8 mm and medial hinge disruption > 2 mm","Neer two-part surgical neck fracture","Greater tuberosity fracture alone","Patient age over 70"],a:0,e:"Anatomic-neck patterns carry the highest risk."},
  {q:"The nerve most commonly injured with proximal humerus fractures is:",o:["Axillary nerve","Radial nerve","Musculocutaneous nerve","Suprascapular nerve"],a:0,e:"Check deltoid function and regimental badge sensation."},
  {q:"The most common complication of locking-plate fixation of the proximal humerus:",o:["Screw perforation of the joint / cut-out","Plate breakage","Infection","Radial nerve palsy"],a:0,e:"Stop head screws short and add calcar screws."},
  {q:"An elderly patient with a 4-part fracture and a deficient rotator cuff is best treated with:",o:["Reverse shoulder arthroplasty","Locking plate","Hemiarthroplasty with tuberosity repair always","K-wires"],a:0,e:"Reverse arthroplasty does not depend on tuberosity healing."},
  {q:"The main blood supply to the humeral head is now believed to be:",o:["The posterior circumflex humeral artery","The anterior circumflex alone","The suprascapular artery","The thoraco-acromial artery"],a:0,e:"Older teaching emphasised the arcuate (anterior circumflex) artery."},
  {q:"The Neer classification counts a 'part' as displaced when:",o:["Displaced > 1 cm or angulated > 45°","Displaced > 2 mm","Any fracture line is visible","Displaced > 5 mm"],a:0,e:"Neer's thresholds are 1 cm and 45°."},
  {q:"An isolated greater tuberosity fracture in an active adult is generally fixed when displaced more than about:",o:["5 mm (3 mm in overhead athletes)","1 cm only","2 cm","Any displacement at all"],a:0,e:"Superior displacement causes subacromial impingement and loss of cuff function; fix with screws or suture-bridge techniques."},
  {q:"The ProFHER trial of displaced proximal humerus fractures involving the surgical neck found that surgery compared with sling treatment gave:",o:["No significant difference in Oxford Shoulder Score at 2 years","Clearly better function with surgery","Clearly better function with sling treatment","Lower mortality with surgery"],a:0,e:"Most fractures in that trial were treated with locking plates or hemiarthroplasty; patient selection remains individual."},
  {q:"In the deltoid-split (anterolateral acromial) approach, the split of the deltoid raphe is limited distally by:",o:["The axillary nerve, about 5–7 cm below the lateral edge of the acromion","The radial nerve in the spiral groove","The musculocutaneous nerve at the coracoid","The suprascapular nerve at the spinoglenoid notch"],a:0,e:"Identify the nerve and pass the plate beneath it, or use a stay suture at the apex of the split."},
  {q:"Loss of reduction after locking-plate fixation of the proximal humerus is reduced most by:",o:["Restoring medial cortical (calcar) support, including inferomedial calcar screws","Using fewer, longer head screws","Positioning the plate high on the greater tuberosity","Leaving the head in slight varus"],a:0,e:"Gardner showed that medial support — anatomical reduction of the calcar or calcar screws — prevents varus collapse."}],
 olecranon:[
  {q:"The Mayo classification of olecranon fractures is based on:",o:["Displacement, comminution and stability of the ulnohumeral joint","Fracture line angle relative to the shaft","Distance of the fracture from the coronoid only","Patient age and bone quality"],a:0,e:"I undisplaced, II displaced but stable, III unstable; each A (non-comminuted) or B (comminuted)."},
  {q:"Tension-band wiring is a poor choice for which olecranon fracture?",o:["A comminuted fracture or one extending distal to the coronoid","A simple transverse fracture through the mid trochlear notch","A displaced transverse fracture in a young adult","A transverse fracture with a large proximal fragment"],a:0,e:"Comminuted, oblique-distal and Monteggia-type fracture-dislocations need plate fixation; compression would collapse the notch."},
  {q:"The commonest complication after olecranon tension-band wiring is:",o:["Symptomatic, prominent hardware needing removal","Non-union","Ulnar nerve palsy","Deep infection"],a:0,e:"Removal rates are high; bending and burying the K-wire hooks under triceps reduces irritation and migration."},
  {q:"The tension-band principle at the olecranon works because:",o:["The dorsal wire neutralises tension, so active elbow flexion produces compression at the articular surface","The K-wires alone compress the fracture","The wire compresses the fracture best in full extension","It holds the fracture rigidly so motion must be avoided"],a:0,e:"The dorsal (tension) side carries the wire; the anterior cortex must be intact to act as the fulcrum."},
  {q:"K-wires that protrude well beyond the anterior ulnar cortex can:",o:["Block forearm rotation and injure the anterior interosseous nerve or vessels","Cause ulnar nerve palsy at the cubital tunnel","Weaken triceps","Produce a cubitus varus"],a:0,e:"Engage the anterior cortex just distal to the coronoid, then back the wires off slightly."},
  {q:"In the cubital tunnel the ulnar nerve passes:",o:["Behind the medial epicondyle, then between the humeral and ulnar heads of FCU beneath Osborne's ligament","Through the arcade of Frohse","Anterior to the medial epicondyle with the median nerve","Between anconeus and ECU"],a:0,e:"It is the nerve at risk with medial wires, drills and retractors in posterior elbow surgery."},
  {q:"In a frail low-demand patient, excision of a comminuted olecranon fragment with triceps advancement is acceptable for up to about:",o:["50% of the articular surface, reattaching triceps close to the joint surface","10% of the articular surface only","90% of the articular surface","Any amount, as the coronoid gives stability"],a:0,e:"Larger excisions or a deficient coronoid/collateral complex make the elbow unstable."},
  {q:"For displaced isolated olecranon fractures in patients over about 75, randomised data show nonoperative treatment gives:",o:["Similar function with fewer complications, despite frequent fibrous union","Clearly worse function","A high rate of elbow instability","More wound breakdown"],a:0,e:"Most older patients tolerate fibrous union; operative fixation in this group carries many hardware and wound complications."}],
 pedicle:[
  {q:"The classic entry point for a lumbar pedicle screw is:",o:["Junction of the mid-transverse-process line and the lateral border of the superior articular process","Centre of the lamina","Base of the spinous process","Tip of the transverse process"],a:0,e:"The mammillary process marks it; it lies just lateral to the facet joint."},
  {q:"In the lumbar spine, transverse pedicle width is generally greatest at:",o:["L5","L1","L2","L3"],a:0,e:"Width increases caudally (L1 narrowest, L5 widest); medial convergence also increases toward L5."},
  {q:"Triggered EMG stimulation of a lumbar pedicle screw elicits a response at 3 mA. This most likely means:",o:["A pedicle wall breach with the screw close to a nerve root","A normal, well-contained screw","Equipment failure only","Excellent bone density"],a:0,e:"Thresholds above about 8 mA are reassuring; below about 5 mA suggests a breach."},
  {q:"Lumbar multifidus is innervated by:",o:["The medial branch of the dorsal ramus, segmentally","The lateral branch of the dorsal ramus","The ventral rami via the lumbar plexus","The femoral nerve"],a:0,e:"Its unisegmental supply makes it vulnerable to denervation with midline subperiosteal stripping."},
  {q:"The Wiltse paraspinal approach gives the most direct access to:",o:["A far-lateral (extraforaminal) disc herniation and the pedicle entry points","The anterior disc space","The contralateral lateral recess","The sacroiliac joint anteriorly"],a:0,e:"It runs between multifidus and longissimus onto the facet and transverse process."},
  {q:"Postoperative visual loss after prone spine surgery is most often due to:",o:["Ischaemic optic neuropathy","Central retinal artery occlusion from direct pressure in most cases","Cortical blindness","Corneal abrasion"],a:0,e:"Risk factors: long prone surgery, large blood loss, anaemia, hypotension and obesity."},
  {q:"After an L4–L5 fusion, adjacent segment degeneration most commonly develops:",o:["At the level above the fusion (L3–L4)","At the level below the fusion","Only at the fused level","In the thoracic spine"],a:0,e:"The cranial adjacent level takes most of the increased motion and stress."},
  {q:"Pedicle screw pull-out strength depends mostly on:",o:["The screw's major (outer) diameter and the bone mineral density","The rod diameter","The tulip-head design","The screw colour coding"],a:0,e:"Cement augmentation or larger screws help in osteoporotic bone."}],
 radshaft:[
  {q:"For a displaced adult radial or both-bone forearm shaft fracture, standard plate fixation uses:",o:["3.5 mm compression plates with at least six cortices (three bicortical screws) on each side of the fracture","2.7 mm plates with four cortices each side","One-third tubular plates","Elastic stable intramedullary nails as for children"],a:0,e:"Absolute stability with interfragmentary compression gives union rates above 95% in simple patterns."},
  {q:"Schemitsch and Richards related functional outcome after forearm shaft plating to restoration of:",o:["The magnitude and location of the maximum radial bow","Ulnar length only","The interosseous membrane width at the wrist","Radial head height"],a:0,e:"Restoring the bow to within a few millimetres of normal preserved rotation and grip strength."},
  {q:"After plating a distal-third radial shaft fracture, the DRUJ is unstable but reduces in supination. Usual management:",o:["Immobilise in supination (above elbow) for about 4–6 weeks, or transfix the DRUJ with K-wires in supination","Ignore it — it will stabilise","Excise the ulnar head","Immediate DRUJ arthrodesis"],a:0,e:"An irreducible DRUJ suggests interposed ECU or soft tissue and needs open reduction."},
  {q:"Radioulnar synostosis after forearm fixation is most associated with:",o:["Exposing both bones through a single incision, high-energy injury and associated head injury","Using separate incisions for radius and ulna","Early active motion","Locking screws"],a:0,e:"Use separate Henry/Thompson and subcutaneous ulnar incisions and avoid graft or screws in the interosseous membrane."},
  {q:"An isolated ulnar shaft ('nightstick') fracture can usually be treated nonoperatively when:",o:["Displacement is under 50% and angulation under about 10°, with no radioulnar joint injury","Displacement is over 50%","It is in the proximal third with radial head dislocation","There is any angulation at all"],a:0,e:"A proximal ulnar fracture with a dislocated radial head is a Monteggia lesion and needs fixation."},
  {q:"In the proximal third of the Henry approach the posterior interosseous nerve is protected by:",o:["Full supination and subperiosteal release of supinator from its insertion, reflected laterally","Full pronation and splitting supinator","Placing a Hohmann retractor around the radial neck","Dividing the arcade of Frohse routinely"],a:0,e:"Supination brings the supinator insertion anterior and carries the nerve away laterally inside the muscle."},
  {q:"The 'leash of Henry' refers to:",o:["Branches of the radial recurrent vessels crossing the field near the radial neck — ligated in the Henry approach and a cause of PIN compression","The arcade of Frohse","The lacertus fibrosus","Struthers' ligament"],a:0,e:"It lies in the radial tunnel; ligating it lets brachioradialis and the radial artery be mobilised."},
  {q:"Refracture after removal of a forearm plate is reduced by:",o:["Not removing it routinely, or waiting at least about 12–18 months and protecting the arm for some weeks afterwards","Removing it at 3 months","Removing it through a smaller incision","Replacing it with a cast for 2 weeks only"],a:0,e:"Screw holes and cortical osteopenia under the plate weaken the bone; most plates are left in situ unless symptomatic."}],
 "thr-daa":[
  {q:"The superficial internervous plane of the direct anterior approach to the hip lies between:",o:["Tensor fasciae latae (superior gluteal n.) and sartorius (femoral n.)","Gluteus medius and TFL","Gluteus maximus fibres","Adductor longus and gracilis"],a:0,e:"Working inside the TFL sheath keeps the lateral femoral cutaneous nerve, which crosses sartorius, medial and protected."},
  {q:"The commonest nerve complication of the direct anterior approach for THR is:",o:["Lateral femoral cutaneous nerve neurapraxia (anterolateral thigh numbness)","Sciatic nerve palsy","Femoral nerve palsy","Superior gluteal nerve palsy"],a:0,e:"Reported in a large minority of patients; most symptoms improve, and starting the incision lateral to the ASIS reduces it."},
  {q:"The vessel that crosses the deep interval of the anterior hip approach and must be ligated is:",o:["The ascending branch of the lateral femoral circumflex artery","The medial femoral circumflex artery","The superior gluteal artery","The obturator artery"],a:0,e:"It runs across the anterior capsule at the base of the neck between rectus femoris and gluteus medius."},
  {q:"To deliver the femur for broaching in the direct anterior approach, the leg is placed in:",o:["Hyperextension, adduction and external rotation, with progressive posterosuperior capsular release","Flexion, adduction and internal rotation","Abduction and internal rotation","Neutral with axial traction"],a:0,e:"Insufficient release with forceful levering is how trochanteric and calcar fractures happen."},
  {q:"An advantage of the supine position for the direct anterior approach is:",o:["Intraoperative AP fluoroscopy and direct comparison of leg lengths","No need for any capsulotomy","A lower risk of femoral fracture than all other approaches","Easier access for revision of femoral stems"],a:0,e:"Femoral exposure is harder and the learning curve steep; extensile options are more limited than posteriorly."},
  {q:"After THR through a direct anterior approach, the position that most risks dislocation is:",o:["Extension with external rotation","Deep flexion with internal rotation","Sitting with legs uncrossed","Abduction"],a:0,e:"The anterior capsule is opened while the posterior capsule and short rotators are preserved, so instability is anterior."},
  {q:"A wound complication particularly associated with the direct anterior approach is:",o:["Delayed healing or infection in obese patients with a pannus overhanging the groin crease","Abductor dehiscence","Posterior thigh haematoma compressing the sciatic nerve","Heterotopic bone in gluteus maximus"],a:0,e:"A large pannus over the incision keeps it moist; consider another approach or careful patient selection."}],
 acl:[
  {q:"In an acute ACL rupture, the meniscus most often torn at the same time is:",o:["The lateral meniscus","The medial meniscus","Both equally","Neither — meniscal tears only occur in chronic ACL deficiency"],a:0,e:"Acute injuries favour lateral tears (often posterior root/horn); in chronic ACL-deficient knees the medial meniscus (posterior horn, the secondary restraint) tears more often."},
  {q:"Arthroscopically, the femoral ACL footprint lies:",o:["Posterior (deep) and inferior to the lateral intercondylar (resident's) ridge on the medial wall of the lateral femoral condyle, with the bifurcate ridge between the AM and PL bundles","Anterior to the resident's ridge on the notch roof","On the lateral wall of the medial femoral condyle","At the top of the notch at 12 o'clock"],a:0,e:"The resident's ridge marks the anterior limit of the footprint; 'over-the-top' and 12 o'clock positions are non-anatomic."},
  {q:"Drilling the femoral tunnel through a standard tibial tunnel (transtibial) tends to produce:",o:["A high, vertical femoral tunnel that controls anterior translation but not rotation (persistent pivot shift)","An over-horizontal graft with roof impingement","Posterior wall blow-out in every case","An anatomic tunnel identical to AM-portal drilling"],a:0,e:"The tibial tunnel constrains the femoral guide — independent (AM portal or outside-in) drilling gives a more anatomic footprint."},
  {q:"Hamstring autograft diameter is linked to revision risk. The threshold commonly quoted is:",o:["Less than 8 mm — higher revision rates, especially in patients under 20","Less than 12 mm","Less than 5 mm only","Diameter has no effect"],a:0,e:"Options for a small graft: 5- or 6-strand configurations, augmentation, or a different graft (BPTB or quadriceps tendon)."},
  {q:"A cyclops lesion after ACL reconstruction presents with:",o:["Loss of terminal extension with a painful clunk — a fibroproliferative nodule anterior to the graft","Recurrent giving way in pivoting","Medial joint-line pain on squatting","Patellar instability"],a:0,e:"It is linked to an anteriorly placed tibial tunnel and graft debris; treatment is arthroscopic excision."},
  {q:"The most common technical cause of ACL graft failure is:",o:["Femoral tunnel malposition, usually too anterior or vertical","Using a hamstring rather than a patellar tendon graft","Interference-screw fixation","Fixing the graft in full extension"],a:0,e:"Tunnel malposition dominates technical failures; trauma and biological failure account for most of the rest."},
  {q:"The commonest complication of hamstring tendon harvest is:",o:["Numbness from injury to the infrapatellar branch of the saphenous nerve","Saphenous vein thrombosis","MCL injury","Patellar tendon rupture"],a:0,e:"A more oblique or horizontal harvest incision and careful dissection reduce it; most patients adapt."},
  {q:"In a high-risk young patient (generalised laxity, high-grade pivot shift, return to pivoting sport), adding a lateral extra-articular tenodesis to hamstring ACL reconstruction has been shown to:",o:["Reduce graft rupture and persistent rotatory instability (STABILITY trial)","Increase graft failure","Have no effect on failure","Replace the need for an intra-articular graft"],a:0,e:"The modified Lemaire tenodesis uses a strip of iliotibial band passed under the LCL to the femur."}],
 "ankle-pl":[
  {q:"The posterolateral approach to the ankle uses the internervous plane between:",o:["Peroneus longus and brevis (superficial peroneal n.) and flexor hallucis longus (tibial n.)","Tibialis anterior and extensor hallucis longus","FHL and flexor digitorum longus","The Achilles tendon and FHL"],a:0,e:"FHL is elevated from the posterior fibula and tibia and retracted medially, exposing the posterolateral tibia and posterior fibula."},
  {q:"The nerve most at risk in the superficial dissection of the posterolateral ankle approach is:",o:["The sural nerve, running with the small saphenous vein","The superficial peroneal nerve","The saphenous nerve","The deep peroneal nerve"],a:0,e:"Its course crosses the line of the incision obliquely; sural neuritis is a recognised complication."},
  {q:"During the posterolateral approach, the posterior tibial artery and tibial nerve are protected by:",o:["Keeping FHL between the dissection and the bundle and retracting it medially","Retracting the peroneal tendons medially","Detaching the Achilles tendon","Working medial to FHL"],a:0,e:"The neurovascular bundle lies between FHL and FDL — dissection medial to FHL endangers it."},
  {q:"Direct fixation of a posterior malleolar fragment improves syndesmotic stability because the fragment carries:",o:["The posterior inferior tibiofibular ligament (PITFL)","The anterior inferior tibiofibular ligament","The deltoid ligament","The interosseous membrane only"],a:0,e:"Anatomical reduction restores the posterior incisura and PITFL tension, often avoiding a syndesmotic screw."},
  {q:"The Bartoníček–Rammelt classification describes:",o:["Posterior malleolar fractures on CT, by size, position and involvement of the fibular notch","Pilon fractures by comminution","Talar neck fractures by displacement","Lateral ankle ligament injuries"],a:0,e:"Type 1 extraincisural, 2 posterolateral, 3 posteromedial two-part, 4 large posterolateral triangular, 5 irregular osteoporotic."},
  {q:"A posteriorly placed (antiglide) plate on a Weber B fibula fracture:",o:["Resists the proximal-posterior displacement of the distal fragment, but placed too distally it irritates the peroneal tendons","Is weaker than a lateral neutralisation plate","Cannot be used with a lag screw","Must always be removed"],a:0,e:"It buttresses the apex of the oblique SER fracture; keep the distal end out of the peroneal groove."}],
 "tibnail-supra":[
  {q:"The main biomechanical reason suprapatellar nailing helps proximal-third tibial fractures is that semi-extension:",o:["Relaxes the extensor mechanism pull that drives the proximal fragment into procurvatum","Makes the canal wider","Removes the need for an accurate entry point","Prevents valgus by tightening the patellar tendon"],a:0,e:"Hyperflexion for infrapatellar nailing increases the quadriceps-driven procurvatum deformity."},
  {q:"In suprapatellar tibial nailing, the quadriceps tendon is entered by:",o:["A longitudinal midline split about 2–3 cm above the superior pole of the patella","A transverse tenotomy","Detaching it from the patella","Going through vastus medialis"],a:0,e:"A longitudinal split preserves the extensor mechanism; the semi-extended position keeps the patella away from the trochlea."},
  {q:"The structures most at risk from suprapatellar instrumentation without a protective sleeve are:",o:["The patellar and trochlear articular cartilage","The common peroneal nerve","The popliteal artery","The infrapatellar branch of the saphenous nerve"],a:0,e:"Arthroscopic studies show little chondral damage when a sleeve is used; reaming debris should be washed out."},
  {q:"Compared with infrapatellar nailing, randomised trials of suprapatellar nailing have generally shown:",o:["Better alignment and similar or less anterior knee pain","Much more anterior knee pain","Higher deep infection rates","Longer union times"],a:0,e:"Fluoroscopy is also easier with the leg flat and the C-arm unobstructed."},
  {q:"The nail entry point in suprapatellar nailing is:",o:["The same as infrapatellar nailing — just medial to the lateral tibial spine at the anterior edge of the plateau","The tibial tubercle","The centre of the medial plateau","Anterior to the patella"],a:0,e:"Only the route to the entry point changes; the entry itself follows the canal on both views."},
  {q:"Suprapatellar nailing is relatively contraindicated in:",o:["A septic knee or open fracture contaminating the knee joint","Proximal-third fractures","Distal-third fractures","Obese patients"],a:0,e:"The approach passes through the knee joint — a contaminated or infected joint is a contraindication."}],
 ctr:[
  {q:"The most sensitive clinical test for carpal tunnel syndrome is:",o:["Durkan's carpal compression test","Tinel's sign","Phalen's test","Froment's sign"],a:0,e:"Froment's tests the ulnar nerve."},
  {q:"The most common cause of persistent symptoms after carpal tunnel release:",o:["Incomplete release of the distal transverse carpal ligament","Recurrent motor branch injury","Infection","Pillar pain"],a:0,e:"Release must be complete under direct vision."},
  {q:"Kaplan's cardinal line helps locate:",o:["The recurrent motor branch and the superficial palmar arch","The ulnar nerve in Guyon's canal","The palmar cutaneous branch","The scaphoid tubercle"],a:0,e:"The arch lies just distal to the ligament."},
  {q:"The commonest course of the recurrent motor branch (Lanz) is:",o:["Extraligamentous, recurrent","Subligamentous","Transligamentous","Absent"],a:0,e:"Transligamentous branches are at particular risk."},
  {q:"Pain over the thenar and hypothenar eminences after release is called:",o:["Pillar pain","CRPS","Recurrence","Neuroma"],a:0,e:"It usually settles over months."},
  {q:"Nerve conduction findings typical of carpal tunnel syndrome:",o:["Prolonged median distal motor and sensory latency across the wrist","Slowed ulnar conduction at the elbow","Normal median latency with fibrillations in FDI","Reduced radial SNAP"],a:0,e:"EMG can show denervation of APB in severe cases."},
  {q:"Which tendon does NOT pass through the carpal tunnel?",o:["Flexor carpi radialis","Flexor pollicis longus","Flexor digitorum superficialis to the ring finger","Flexor digitorum profundus to the index finger"],a:0,e:"The tunnel holds nine tendons (4 FDS, 4 FDP, FPL) and the median nerve; FCR runs in its own fibro-osseous canal in the trapezium groove."},
  {q:"To protect the palmar cutaneous branch of the median nerve, the open carpal tunnel incision is placed:",o:["In line with the radial border of the ring finger, ulnar to the thenar crease, not crossing the wrist crease","Directly in the thenar crease","Radial to the FCR tendon","Transversely across the distal wrist crease"],a:0,e:"The palmar cutaneous branch leaves the median nerve about 5 cm above the wrist crease and runs between FCR and palmaris longus to the thenar skin."},
  {q:"For severe carpal tunnel syndrome with loss of thumb opposition, the Camitz opponensplasty transfers:",o:["Palmaris longus, lengthened with a strip of palmar fascia, to the APB insertion","FDS of the ring finger around the FCU pulley","Extensor indicis proprius","Abductor digiti minimi (Huber)"],a:0,e:"It restores palmar abduction rather than full opposition and is often done at the same sitting as the release."},
  {q:"Carpal tunnel syndrome arising in pregnancy is best managed initially by:",o:["Night splinting in neutral, since most cases resolve after delivery","Immediate surgical release","Diuretics and steroid tablets","Ulnar nerve transposition"],a:0,e:"Release is reserved for severe or progressive deficit or symptoms persisting after delivery."}]

function pickViva(id,n=3){const bank=OPQ[id]||[];S.opq=S.opq||{};let seen=S.opq[id]||[];if(seen.length+n>bank.length)seen=[];const pool=bank.map((q,i)=>i).filter(i=>!seen.includes(i));const sel=shuffle(pool).slice(0,n);S.opq[id]=seen.concat(sel);save();return sel.map(i=>bank[i])}
function runViva(proc,el,done){const qs=pickViva(proc.id);if(!qs.length){done();return}let k=0,right=0;
 const q=()=>{const Q=qs[k],order=shuffle([0,1,2,3]);el.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><p class="eyebrow">Post-op viva · ${esc(proc.name)} · ${k+1}/${qs.length}</p><p class="prompt">${esc(Q.q)}</p><div class="opts">${order.map((o,i)=>`<button class="opt" data-o="${o}"><span class="k">${"ABCD"[i]}</span><span>${esc(Q.o[o])}</span></button>`).join("")}</div><div id="vfb"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=+b.dataset.o,bs=[...el.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);bs.find(x=>+x.dataset.o===Q.a).classList.add("ok");const ok=o===Q.a;if(ok)right++;else b.classList.add("bad");S.ans++;if(ok)S.cor++;save();
   document.getElementById("vfb").innerHTML=`<div class="fb ${ok?"":"bad"}"><b>${ok?"Correct":"Not quite"}.</b> ${esc(Q.e)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="vnx">${k===qs.length-1?"See results":"Next question"}</button></div>`;
   document.getElementById("vnx").onclick=()=>{if(k===qs.length-1){addXP(right*30);done(right,qs.length)}else{k++;q()}}})};
 q()}

 const metal=new THREE.MeshStandardMaterial({color:0xDDE3EA,metalness:.7,roughness:.2,transparent:true});const blue=new THREE.MeshStandardMaterial({color:0x3E6FB8,roughness:.4,transparent:true});
