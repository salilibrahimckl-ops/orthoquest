<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OrthoQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen game shell — sticky HUD on top, scrolling stage, bottom mode bar. Lightbox-slate world, gentian-violet skin-marker accent. */
:root{
  --bg:#0E151E; --panel:#151F2B; --panel2:#1B2836; --line:#2A3A4D;
  --fg:#E7EDF3; --muted:#8E9DAF; --bone:#EDE3CF;
  --accent:#A274FF; --accent-ink:#140A26; --accent-soft:rgba(162,116,255,.16);
  --ok:#3CC896; --bad:#FF6B6B; --warn:#F2B14B;
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.hud{flex:none;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em}
.logo b{color:var(--build,var(--accent))}
.logo small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--build,var(--muted));opacity:.85;margin-top:-2px}
.newcard{border-color:var(--build,var(--accent));display:flex;flex-direction:column;gap:8px}
.newcard .row{justify-content:space-between;flex-wrap:nowrap}
.hud .rank{margin-left:auto;text-align:right;min-width:0}
.rank small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rank span{font-family:var(--display);font-weight:600;font-size:14px}
.xpbar{height:4px;width:120px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--build,var(--accent));width:0;transition:width .5s}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.view.full{max-width:1100px}
nav.bar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bar button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current="page"]{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode .tag{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.mode p{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:12px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border:2px dashed var(--accent);border-radius:50%;opacity:.25}
.hero .badge{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 18px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Atlas */
.stage{position:relative;height:min(58vh,520px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 40%,#1A2838 0%,var(--bg) 75%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .hint{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
.stage .tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.stage .tools button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(21,31,43,.85);display:grid;place-items:center}
.stage .tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stage .label{position:absolute;left:12px;top:10px;font-family:var(--display);font-weight:600;font-size:15px;background:rgba(14,21,30,.8);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.facts li{max-width:65ch}
.facts li::marker{color:var(--accent)}
.aplist{display:flex;flex-direction:column;gap:8px}
.ap{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ap small{display:block;color:var(--muted);font-size:12px}
.ap .go{font-family:var(--mono);font-size:12px;color:var(--accent);flex:none}
/* Sim */
.monitor{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#08110D;border:1px solid #1D3A2E;border-radius:10px;padding:10px 12px}
.monitor canvas{width:100%;height:44px;display:block}
.vitals{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--mono)}
.vitals .hr{font-size:22px;color:var(--ok);font-variant-numeric:tabular-nums;line-height:1}
.vitals .hr.alarm{color:var(--bad)}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--ok)}
.pips i.off{background:#24342C}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--warn);width:100%}
.step-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prompt{font-size:17px;font-weight:600;line-height:1.4;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(60,200,150,.1)}
.opt.ok .k{background:var(--ok);color:#06231A}
.opt.bad{border-color:var(--bad);background:rgba(255,107,107,.1)}
.opt.bad .k{background:var(--bad);color:#2A0808}
.opt:disabled{cursor:default}
.fb{border-left:3px solid var(--ok);background:var(--panel2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;max-width:65ch}
.fb.bad{border-left-color:var(--bad)}
.fb b{font-family:var(--display)}
.vignette{font-size:15px;background:var(--panel2);border-radius:8px;padding:14px;border:1px dashed var(--line);max-width:70ch}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 16px}
.stars{font-size:34px;letter-spacing:6px;color:var(--warn)}
.stars .dim{color:var(--line)}
.big{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;font-family:var(--display);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.apcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.apcard:hover{border-color:var(--accent)}
.apcard .plane{font-size:13px;color:var(--muted)}
.apcard .best{font-family:var(--mono);font-size:12px;color:var(--warn)}
.tagline{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}.xpbar{width:90px}}
.stage.or{height:min(56vh,560px)}
.orhud{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 64px);pointer-events:none}
.orhud span{font-family:var(--mono);font-size:11px;background:rgba(8,17,13,.85);border:1px solid #1D3A2E;color:#8FCDB4;padding:3px 7px;border-radius:6px;display:inline-flex;gap:5px;align-items:center}
.orhud b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.orhud b.alarm{color:var(--bad)}
.stage .phase{position:absolute;left:10px;bottom:10px;right:56px;font-family:var(--display);font-weight:600;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
.stage.fluoro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(0,0,0,.88) 71%)}
.stage.fluoro .phase{color:#fff}
.stage .tools{z-index:2}
.stage .tools button svg{width:18px;height:18px}
.stage.scalpel canvas{cursor:crosshair}
.timeline{display:flex;gap:4px}
.timeline i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.timeline i.done{background:var(--ok)}.timeline i.cur{background:var(--accent)}.timeline i.err{background:var(--warn)}
.layers{display:flex;gap:8px;flex-wrap:wrap}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kind{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.proc{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.proc .row .btn{padding:8px 12px}
.sbar{position:absolute;left:10px;right:58px;bottom:10px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:rgba(14,21,30,.9);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:2}
.sbar .sbt{min-width:0;display:flex;flex-direction:column;font-size:12px;line-height:1.3}
.sbar .sbt b{font-family:var(--display);font-size:14px}
.sbar .sbt span{color:var(--muted)}
.sbar.ok{border-color:var(--ok)}.sbar.ok b{color:var(--ok)}.sbar.bad{border-color:var(--bad)}.sbar.bad b{color:var(--bad)}
.sbar .btn{padding:8px 12px;flex:none}
.fb.hint{border-left-color:var(--accent)}
.apchips{display:flex;flex-wrap:wrap;gap:6px}
.apchips .chip{padding:5px 11px;font-size:12px;white-space:normal;text-align:left;line-height:1.3}
.apchips .chip.soon{opacity:.55;border-style:dashed;font-weight:500}
.newb{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;background:var(--build,var(--accent));color:#10141a;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px}
.asearch{position:relative}.asearch input{width:100%;font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.aqr{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel2);border:1px solid var(--line);border-radius:9px;max-height:260px;overflow:auto;display:flex;flex-direction:column}
.aqr button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:8px}.aqr .dot{width:8px;height:8px;border-radius:50%;flex:none}
.secrow{display:flex;flex-direction:column;gap:8px;padding:12px}.secrow input[type=range]{width:100%;accent-color:var(--accent)}
.lensbox{position:absolute;left:10px;top:40px;max-width:calc(100% - 70px);max-height:36%;overflow:auto;background:rgba(14,21,30,.92);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:3;display:flex;flex-direction:column;gap:6px;font-size:12px}
.lensbox .apchips .chip{font-size:11px;padding:4px 9px}
.loadmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(14,21,30,.9);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-family:var(--mono);font-size:12px;text-align:center;max-width:80%}
</style>

<div class="app">
  <header class="hud">
    <div class="logo">ORTHO<b>QUEST</b><small id="bldTag">Update</small></div>
    <div class="rank"><small id="hudXp">0 XP</small><span id="hudRank">Intern</span><div class="xpbar"><i id="hudBar"></i></div></div>
  </header>
  <main id="main"></main>
  <nav class="bar" aria-label="Modes">
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Home</button>
    <button data-v="atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7M8 9.5h8M12 14l-3 7M12 14l3 7"/></svg>3D Atlas</button>
    <button data-v="or"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20L15 9M15 9l3-3 2 2-3 3M15 9l2 2"/><path d="M4 20l2-5" stroke-dasharray="2 2"/></svg>Operate</button>

    <button data-v="ward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h5"/></svg>Cases</button>
  </nav>
</div>

<script>
/* ================= BUILD MARKER (bump n, hue +137, date and news on every publish) ================= */
const BUILD={n:42,hue:27,date:"31 Oct 2026, 18:30 IST",news:["3D Atlas rebuilt for realism: wet-tissue textures on every muscle, tendon, bone, vessel and nerve, with true cut surfaces when you slice", "About 200 new nerve structures: brachial plexus (roots, trunks, cords, all branches), spinal nerve roots C5–L5, every intercostal nerve, phrenic, vagus, recurrent laryngeal, accessory, sympathetic chain, lumbar and sacral plexus (LFCN, obturator divisions, genitofemoral, ilioinguinal, pudendal, gluteal), digital nerves of every finger, plantar and dorsal foot nerves, orbital cranial nerves", "New Lymph layer: cervical, axillary (5 groups), epitrochlear, inguinal (horizontal, vertical, Cloquet), popliteal, iliac, para-aortic, mediastinal and parasternal nodes, thoracic duct, cisterna chyli, right lymphatic duct and limb lymphatic vessels", "Atlas tools: search any structure by name, ghost muscles to see the nerves and vessels beneath, cross-section slicer (transverse, sagittal, coronal), isolate a structure; tap anything for origin–insertion–nerve–action or root values and clinical pearls", "Operating theatre: the same detailed nerves and lymphatics now appear in every operating field, plus an Anatomy lens button (eye icon) that makes the layers see-through and lists every nerve, artery, vein and node in your field"]};

 shoulder:{name:"Shoulder girdle",facts:[
  "Rotator interval: between supraspinatus and subscapularis; contains coracohumeral ligament, SGHL and the long head of biceps.",

 elbow:{name:"Elbow",facts:[
  "Terrible triad: posterior dislocation + radial head fracture + coronoid fracture.",

 forearm:{name:"Forearm",facts:[
  "Monteggia: proximal ulna fracture + radial head dislocation; Bado I (anterior) most common; PIN most often affected.",

 hand:{name:"Wrist & hand",facts:[

 spine:{name:"Spine",facts:[

 const rank=o=>[(+o.xp||0),(+o.ans||0),Object.keys(o.or||{}).length,(+o.t||0)];const better=(a,b)=>{const x=rank(a),y=rank(b);for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]>y[i]}return false};

const E={};let engOn=false;

 if(E.r)return E;if(!window.THREE)return null;
 const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));r.localClippingEnabled=true;
 const cam=new THREE.PerspectiveCamera(34,1,.05,300);
 const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.screenSpacePanning=true;
 Object.assign(E,{r,cam,ctl,scene:null,camGoal:null,ray:new THREE.Raycaster()});
 ctl.addEventListener("start",()=>{E.camGoal=null;if(E.onUserMove)E.onUserMove()});
 const tick=()=>{if(!engOn){E.raf=null;return}
  const c=r.domElement.parentElement;if(c){const w=c.clientWidth,h=c.clientHeight,pr=r.getPixelRatio();if(w&&h&&(r.domElement.width!==Math.floor(w*pr)||r.domElement.height!==Math.floor(h*pr))){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}
  if(E.camGoal){const g=E.camGoal;cam.position.lerp(g.p,.08);ctl.target.lerp(g.t,.08);if(cam.position.distanceTo(g.p)<.01&&ctl.target.distanceTo(g.t)<.01)E.camGoal=null}
  if(E.onFrame)E.onFrame();ctl.update();if(E.scene)r.render(E.scene,cam);E.raf=requestAnimationFrame(tick)};
 E.start=()=>{if(!E.raf)E.raf=requestAnimationFrame(tick)};
 let down=null;
 r.domElement.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];if(E.onDown)E.onDown(e)});
 r.domElement.addEventListener("pointermove",e=>{if(E.onMove)E.onMove(e)});
 const up=e=>{if(E.onUp)E.onUp(e);if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<8&&E.onTap)E.onTap(e);down=null};
 r.domElement.addEventListener("pointerup",up);
 E.ndc=e=>{const b=r.domElement.getBoundingClientRect();return new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1)};
 E.pick=(e,list)=>{E.ray.setFromCamera(E.ndc(e),cam);return E.ray.intersectObjects(list.filter(m=>m&&m.visible),false)[0]};
 E.view=(p,t,instant)=>{const P=new THREE.Vector3(...p),T=new THREE.Vector3(...t);if(instant){cam.position.copy(P);ctl.target.copy(T);E.camGoal=null}else E.camGoal={p:P,t:T}};
 E.reset=()=>{E.onTap=E.onDown=E.onMove=E.onUp=E.onFrame=E.onUserMove=null;ctl.enabled=true;ctl.enableRotate=true};
 return E;
}

 if(kind==="lymph")return pick(LFACT);if(kind==="nerve")return pick(NFACT);if(kind==="muscle"||kind==="tendon")return pick(AFACT);return null}

 const extra={"saphenous":"Saphenous nerve: terminal branch of the femoral nerve; accompanies the great saphenous vein in the leg.","infrapatellar":"Crosses the anteromedial knee below the patella — commonly cut in midline and medial knee incisions, giving lateral scar numbness.","superior gluteal":"Runs between gluteus medius and minimus about 5 cm above the greater trochanter. Injury causes a Trendelenburg gait.","deep peroneal":"Anterior compartment; supplies tibialis anterior, EHL, EDL and the first web space.","superficial peroneal":"Lateral compartment; pierces the deep fascia in the distal leg — at risk with lateral ankle portals and fibula plating.","posterior interosseous":"Deep branch of the radial nerve through the arcade of Frohse and supinator. At risk in Thompson and Kocher approaches.","superficial branch of radial":"Runs under brachioradialis then dorsally over the radial styloid — neuroma risk in wrist incisions.","musculocutaneous":"Pierces coracobrachialis 5–8 cm below the coracoid; at risk with conjoint-tendon retraction.","cauda":"Lumbar and sacral roots below the conus; cauda equina syndrome is a surgical emergency."};
 for(const k in extra)if(n.includes(k))return extra[k];return bs>=.5?best:null}

let ecgRaf=null,hr=72;
function startECG(){const c=document.getElementById("ecg");if(!c)return;const ctx=c.getContext("2d");let x=0,ph=0,last=performance.now();
 const W=()=>c.width,H=()=>c.height;c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.lineWidth=3;let py=H()/2;
 function y(p){if(p<.04)return -Math.sin(p/.04*Math.PI)*.12;if(p>.1&&p<.13)return .18;if(p>=.13&&p<.16)return -1;if(p>=.16&&p<.19)return .35;if(p>.3&&p<.42)return -Math.sin((p-.3)/.12*Math.PI)*.22;return 0}
 const tick=t=>{const dt=(t-last)/1000;last=t;const steps=Math.max(1,Math.round(dt*240));
  for(let i=0;i<steps;i++){ph+=hr/60/240;if(ph>1)ph-=1;const nx=(x+1)%W();ctx.clearRect(nx,0,14,H());
   const ny=H()/2+y(ph)*H()*.42;ctx.strokeStyle=hr>110?"#FF6B6B":"#3CC896";ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(nx===0?x:nx,ny);ctx.stroke();x=nx;py=ny}
  ecgRaf=requestAnimationFrame(tick)};ecgRaf=requestAnimationFrame(tick);}
function stopECG(){if(ecgRaf){cancelAnimationFrame(ecgRaf);ecgRaf=null}}

  const T=25000,t0=performance.now(),bar=document.getElementById("tbar");let done=false;
  const tick=()=>{const p=1-(performance.now()-t0)/T;bar.style.width=Math.max(0,p*100)+"%";if(p<=0){answer(-1);return}timerId=requestAnimationFrame(tick)};stopTimer();timerId=requestAnimationFrame(tick);
  function answer(i){if(done)return;done=true;stopTimer();const left=Math.max(0,1-(performance.now()-t0)/T);

   <div style="text-align:left;width:100%"><p class="eyebrow" style="margin-bottom:6px">Plane</p><p style="margin-bottom:12px">${esc(ap.plane)}</p><p class="eyebrow" style="margin-bottom:6px">Pearls</p><ul class="facts">${ap.pearls.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
   <div class="row" style="justify-content:center"><button class="btn primary" id="again">Operate again</button><button class="btn" id="see3d">See incision in 3D</button><button class="btn ghost" id="back">All approaches</button></div></div>`;
  document.getElementById("again").onclick=()=>runSim(ap);document.getElementById("back").onclick=()=>go("theatre");document.getElementById("see3d").onclick=()=>go("atlas",{approach:ap.id});}

function famOf(p){return FAMILIES.find(f=>f.aps.some(a=>a.p===p.id))||FAMILIES.find(f=>f.id===p.family)||null}
function famList(){const out=[],seen=new Set();PROCS.forEach(p=>{const f=famOf(p);const key=f?f.id:"_"+p.id;if(seen.has(key))return;seen.add(key);
  if(f){const aps=f.aps.map(a=>({n:a.n,d:a.d||"",proc:a.p?PROCS.find(q=>q.id===a.p)||null:null}));PROCS.filter(q=>q.family===f.id&&!aps.some(a=>a.proc===q)).forEach(q=>aps.push({n:q.apName||q.approach,d:"",proc:q}));out.push({id:f.id,name:f.name,aps})}
  else out.push({id:"_"+p.id,name:p.name,aps:[{n:p.apName||p.approach,d:"",proc:p}]})});return out}
PROCS.forEach(p=>{const f=famOf(p);if(f){p.family=p.family||f.id;const a=f.aps.find(x=>x.p===p.id);if(a&&!p.apName)p.apName=a.n}});

const OPQ={
 "hemi-daa":[
  {q:"Compared with the posterior approach, the main advantage of a direct anterior approach for hip hemiarthroplasty is:",o:["A lower dislocation rate, because the posterior capsule and short external rotators are left intact","Easier access to the femoral canal","A lower rate of intraoperative femoral fracture","No learning curve"],a:0,e:"The trade-off is a harder femoral exposure, with more intraoperative fractures early in a surgeon's experience."},
  {q:"To elevate the femur in a direct anterior approach, the soft-tissue releases are performed in the order:",o:["Superior (posterolateral) capsule first, then the conjoint tendon (obturator internus/gemelli) if needed, keeping piriformis wherever possible","Piriformis first, then the capsule","Gluteus medius tendon first","Iliopsoas from the lesser trochanter first"],a:0,e:"Release step by step only until the femur lifts — every extra release increases posterior instability."},
  {q:"The intraoperative fracture most typical of the direct anterior approach occurs at the:",o:["Greater trochanter during elevation and levering, or the calcar during broaching","Femoral diaphysis below the stem tip only","Acetabular posterior wall","Lesser trochanter during capsulotomy"],a:0,e:"Osteoporotic bone in hip-fracture patients raises the risk; recognise calcar cracks and add a cerclage wire."},
  {q:"A patient feature that makes the direct anterior approach particularly difficult is:",o:["Obesity with an abdominal pannus over the groin, or a very muscular male with a short varus neck","A slim build","A valgus femoral neck","A previous knee replacement on the same side"],a:0,e:"The pannus also raises wound-healing problems in the groin crease."},
  {q:"In a displaced femoral neck fracture treated through the direct anterior approach, the femoral head is usually removed by:",o:["A clean neck cut and extraction with a corkscrew — no dislocation is needed","Posterior dislocation","A trochanteric osteotomy","Leaving the head in and resurfacing it"],a:0,e:"The head is kept and measured to size the bipolar head."},
  {q:"Large comparative series of hemiarthroplasty approaches suggest that the direct anterior approach:",o:["Has a low dislocation rate but more intraoperative fractures during the learning curve, with no clear difference in mortality","Reduces 30-day mortality by half","Is recommended by NICE as the routine approach","Has the highest dislocation rate of all approaches"],a:0,e:"NICE suggests considering an anterolateral approach; the best approach is the one the surgeon performs safely and routinely."}],
 "achilles-perc":[
  {q:"The original percutaneous Achilles repair (Ma and Griffith, 1977) uses:",o:["Six stab incisions and a Bunnell-type suture passed through both stumps","A single transverse incision and anchors","A turndown flap of the gastrocnemius aponeurosis","An external fixator"],a:0,e:"Modern versions add a mini-open incision or a jig to protect the sural nerve."},
  {q:"The complication commoner after percutaneous than open Achilles repair is:",o:["Sural nerve injury","Wound infection","Skin necrosis","Deep vein thrombosis"],a:0,e:"Wound complications are commoner after open repair; re-rupture rates are similar."},
  {q:"The sural nerve crosses the lateral border of the Achilles tendon approximately:",o:["9–10 cm proximal to the calcaneal insertion","At the insertion itself","At the musculotendinous junction of soleus only","2 cm above the lateral malleolus"],a:0,e:"So the proximal lateral stab incision is the most dangerous — enlarge it and spread bluntly."},
  {q:"Compared with open repair, percutaneous repair of an acute Achilles rupture has:",o:["Fewer wound complications with a similar re-rupture rate","A much higher re-rupture rate","More deep infections","No risk to the sural nerve"],a:0,e:"Meta-analyses support minimally invasive repair as an option, especially for patients at risk of wound problems."},
  {q:"A contraindication to percutaneous Achilles repair is:",o:["An insertional avulsion or a chronic rupture with a large gap","A mid-substance acute rupture 5 cm above the calcaneus","A patient who smokes","Age over 30"],a:0,e:"Insertional ruptures need anchors; chronic ruptures need reconstruction."},
  {q:"Mini-open jig systems (such as PARS or Achillon) reduce sural nerve injury mainly because:",o:["The sutures are passed inside the paratenon through a small incision over the gap, keeping the nerve outside the suture path","They avoid sutures altogether","They are used only with general anaesthesia","They are inserted from the lateral side"],a:0,e:"They keep the small incision while improving suture purchase and nerve safety."}],
 latarjet:[
  {q:"Anteroinferior glenoid bone loss above which an isolated soft-tissue Bankart repair has an unacceptable failure rate (the classic 'inverted pear') is about:",o:["20–25% of the glenoid width","5%","50%","Any bone loss at all"],a:0,e:"Burkhart and De Beer; more recent work shows worse outcomes even above about 13–15% ('subcritical' bone loss)."},
  {q:"In the Instability Severity Index Score (Balg and Boileau), a score above 6 predicts:",o:["A recurrence rate of about 70% after arthroscopic Bankart repair, favouring a bone-block procedure","Posterior instability","Successful non-operative treatment","Multidirectional instability needing capsular shift"],a:0,e:"ISIS points: age ≤20, competitive or contact/overhead sport, hyperlaxity, Hill-Sachs on AP in external rotation, loss of glenoid contour."},
  {q:"The glenoid track (Yamamoto, Di Giacomo) is calculated as:",o:["0.83 × the glenoid diameter minus the width of the glenoid bone defect; a Hill-Sachs interval wider than the track is 'off-track'","The glenoid version on axial CT","The width of the Hill-Sachs lesion alone","The humeral head diameter divided by the glenoid height"],a:0,e:"Off-track lesions engage — treat with a Latarjet or Bankart plus remplissage depending on the glenoid bone loss."},
  {q:"The nerve most often injured in an open Latarjet is the:",o:["Musculocutaneous nerve","Long thoracic nerve","Suprascapular nerve","Radial nerve"],a:0,e:"Traction on the conjoint tendon stretches it; the axillary nerve (under subscapularis) is next. Most palsies are neurapraxias."},
  {q:"Of the 'triple blocking effect' of the Latarjet, the component thought to be most important in abduction and external rotation is:",o:["The sling effect of the conjoint tendon over the lower subscapularis","The bone block alone","The capsular repair to the coraco-acromial ligament stump","Tightening of subscapularis"],a:0,e:"Biomechanical studies (Yamamoto, Wellmann) show the sling contributes most at the end of range."},
  {q:"A coracoid graft fixed lateral to (proud of) the glenoid articular surface leads to:",o:["Glenohumeral arthritis","Recurrent instability","Musculocutaneous nerve palsy","Coracoid nonunion only"],a:0,e:"A graft placed more than about 5 mm medial instead predisposes to recurrence; aim for flush."},
  {q:"The difference between a Bristow and a Latarjet procedure is that the Bristow transfers:",o:["Only the tip of the coracoid, fixed standing with one screw, whereas the Latarjet lays 2–3 cm of the horizontal coracoid flat with two screws","The iliac crest instead of the coracoid","The coracoid without the conjoint tendon","The coracoid to the posterior glenoid"],a:0,e:"The Latarjet gives a larger bony arc and a stronger construct; both share the sling effect."}],
 hallux:[
  {q:"Normal values on a standing AP radiograph of the foot are a hallux valgus angle and intermetatarsal (1–2) angle of less than about:",o:["15° and 9°","25° and 15°","5° and 2°","30° and 20°"],a:0,e:"Mild deformity: HVA <20–25°, IMA <11–13°; severe: HVA >40°, IMA >16–20° (grading varies by author)."},
  {q:"A distal chevron osteotomy is best suited to hallux valgus with:",o:["Mild–moderate deformity (IMA up to about 13–15°) and a joint without arthritis","Severe IMA over 20°","An arthritic first MTP joint","First-ray hypermobility"],a:0,e:"Larger IMAs need scarf or proximal osteotomies or a Lapidus arthrodesis; arthritis needs a fusion."},
  {q:"The nerve most at risk from the medial approach to the first MTP joint is the:",o:["Dorsomedial cutaneous nerve of the hallux (from the superficial peroneal nerve)","Deep peroneal nerve","Medial plantar nerve trunk","Sural nerve"],a:0,e:"Neuroma or numbness on the dorsomedial great toe is a common complaint after bunion surgery."},
  {q:"Avascular necrosis of the metatarsal head after a distal chevron osteotomy is most associated with:",o:["Extensive lateral soft-tissue release and circumferential capsular stripping","The use of screw fixation","Medial capsular plication","Early weight-bearing in a stiff-soled shoe"],a:0,e:"The head is supplied by dorsal and plantar-lateral vessels entering near the capsule; a distal osteotomy already threatens part of this supply."},
  {q:"Hallux varus after bunion surgery is classically caused by all EXCEPT:",o:["Leaving the medial eminence unresected","Over-resection of the medial eminence (lateral to the sagittal groove)","Lateral sesamoidectomy or excessive lateral release","Over-tight medial capsular plication or overcorrection of the IMA"],a:0,e:"Under-resection leaves a bump; the others destabilise the joint medially."},
  {q:"An increased distal metatarsal articular angle (DMAA) in hallux valgus means:",o:["The articular surface is tilted laterally on the head (a congruent deformity) — correct it with a biplanar/rotational osteotomy rather than soft-tissue realignment alone","The joint is subluxed and incongruent","The first ray is hypermobile","The sesamoids are absent"],a:0,e:"Realigning a congruent joint by soft tissues alone makes it incongruent and stiff; typical of juvenile hallux valgus."},
  {q:"In juvenile/adolescent hallux valgus:",o:["DMAA is often increased and recurrence after surgery is common, so surgery is usually delayed until near skeletal maturity","Lapidus arthrodesis is the first choice at age 10","The IMA is always normal","Simple exostectomy is curative"],a:0,e:"An open first metatarsal physis also limits proximal osteotomies."},
  {q:"Each millimetre of lateral translation of the capital fragment in a distal chevron osteotomy corrects the intermetatarsal angle by approximately:",o:["1°","5°","0.1°","10°"],a:0,e:"Translation is limited to about a third to a half of the metatarsal width, which caps the achievable correction."}],
 "patella-screws":[
  {q:"Compared with modified tension-band wiring over K-wires, cannulated lag screws with a tension-band wire passed through them for a transverse patella fracture:",o:["Show less fracture displacement under cyclic loading in biomechanical studies","Are weaker and allow more gapping","Need no anterior wire","Are preferred for comminuted osteoporotic fractures"],a:0,e:"The screws lag the fracture and anchor the wire; they need large fragments and reasonable bone."},
  {q:"When cannulated screws are used with a tension band for a patella fracture, the screws should be:",o:["Slightly shorter than the patella so their tips stay within bone and do not cut the wire","Long enough to protrude 5 mm beyond the superior pole","Fully threaded and crossed at the fracture","Inserted from anterior to posterior"],a:0,e:"Protruding tips or threads saw through the cerclage wire as the knee moves."},
  {q:"The typical screws used with a tension band through cannulations for a transverse patella fracture are:",o:["Two parallel 4.0 mm partially threaded cannulated screws with the threads beyond the fracture","A single 6.5 mm fully threaded screw","Two 2.0 mm cortical screws","Headless compression screws inserted transversely"],a:0,e:"Placed about 20–25 mm apart, parallel to each other and to the articular surface, in the middle of the patellar depth."},
  {q:"Cannulated screw fixation is a poor choice for a patella fracture when:",o:["The poles are comminuted or the bone is osteoporotic","The fracture is simple and transverse","The patient is young","The fragments are large"],a:0,e:"Comminution needs K-wire constructs with cerclage, fixed-angle/mesh plating, or partial patellectomy with tendon reattachment."},
  {q:"With cannulated screws, the tension-band wire is passed:",o:["Up through one cannulation and down through the other, crossing as a figure-of-eight over the anterior surface","Around the screw heads only","Through the quadriceps tendon alone without crossing the patella","Circumferentially around the patella only (cerclage) with no screws"],a:0,e:"The anterior crossing wire converts the tensile pull of the extensor mechanism into articular compression during flexion."},
  {q:"A displaced vertical (longitudinal) patella fracture with an intact extensor mechanism is usually managed by:",o:["Non-operative treatment if displacement is minimal; transverse lag screws if displaced","Tension-band wiring in every case","Total patellectomy","Partial patellectomy of the lateral fragment always"],a:0,e:"Vertical fractures do not disrupt the extensor mechanism; the issue is articular congruity."}],
 "fasciotomy-single":[
  {q:"In the single-incision (perifibular) fasciotomy, the deep posterior compartment is reached by:",o:["Following the posterior surface of the fibula — retracting the peronei anteriorly and soleus posteriorly, detaching soleus and FHL from the fibula and opening the fascia over tibialis posterior","Dividing the interosseous membrane through the anterior compartment","Splitting the medial head of gastrocnemius","Excising the fibular head"],a:0,e:"Staying on bone protects the peroneal vessels that run close to the posterior fibula."},
  {q:"At the proximal end of a lateral perifibular fasciotomy incision, the structure at greatest risk is the:",o:["Common peroneal nerve at the fibular neck","Superficial peroneal nerve","Sural nerve","Saphenous nerve"],a:0,e:"It winds round the fibular neck deep to fibularis longus; the incision and fascial cuts stay distal to it."},
  {q:"Fibulectomy-fasciotomy for compartment syndrome is now:",o:["Abandoned — unnecessary for decompression and adds morbidity (peroneal nerve injury, bleeding, loss of a lateral strut)","The standard technique in trauma","Mandatory for the deep posterior compartment","Preferred in children"],a:0,e:"Perifibular fasciotomy releases all four compartments without resecting bone."},
  {q:"For acute compartment syndrome after tibial fracture, BOAST 10 recommends:",o:["Two-incision (anterolateral + posteromedial) four-compartment fasciotomy as the standard","A single lateral incision in all cases","Release of the anterior compartment only","Percutaneous subcutaneous fasciotomy"],a:0,e:"Two incisions give reliable release of the deep posterior compartment and preserve the posterior tibial artery perforators needed for flaps."},
  {q:"The lateral compartment of the leg contains:",o:["Fibularis (peroneus) longus and brevis and the superficial peroneal nerve","Tibialis anterior and the deep peroneal nerve","Tibialis posterior and the peroneal artery","Extensor digitorum longus and the anterior tibial artery"],a:0,e:"Its blood supply comes from branches of the peroneal and anterior tibial arteries — no named artery runs in it."},
  {q:"An early sensory sign of anterior compartment syndrome of the leg is:",o:["Reduced sensation in the first web space (deep peroneal nerve)","Numbness over the lateral border of the foot","Numbness over the medial malleolus","Loss of sensation on the sole"],a:0,e:"Lateral border = sural; medial malleolus = saphenous; sole = tibial nerve (deep posterior compartment)."}],
 fasciotomy:[
  {q:"In acute compartment syndrome of the leg, the compartment most often involved is:",o:["Anterior","Lateral","Superficial posterior","Deep posterior"],a:0,e:"The anterior compartment is most often affected (tight fascia over a rigid tibia and interosseous membrane); the deep posterior is the one most often inadequately released."},
  {q:"In the two-incision fasciotomy, the anterolateral incision is centred over the anterior intermuscular septum. The nerve at risk in this incision is the:",o:["Superficial peroneal nerve, which pierces the deep fascia at the junction of the middle and distal thirds","Deep peroneal nerve on the interosseous membrane","Sural nerve","Saphenous nerve"],a:0,e:"Identify it before extending the lateral compartment fasciotomy distally; the fascia is cut about 1 cm either side of the septum."},
  {q:"The posteromedial fasciotomy incision is placed about 1.5–2 cm behind the posteromedial border of the tibia mainly so that:",o:["The perforators from the posterior tibial artery that supply local fasciocutaneous flaps are preserved and bone is not exposed if the wound gapes","The great saphenous vein can be harvested","The tibial nerve can be decompressed directly","A single incision can release all four compartments"],a:0,e:"Plastic surgical guidance (BOAST/BAPRAS) — poorly placed fasciotomy incisions can destroy the flaps needed to cover an open tibial fracture."},
  {q:"To reach the deep posterior compartment through the posteromedial incision, the surgeon:",o:["Detaches the soleus origin from the posteromedial tibia (the soleal bridge) and opens the fascia over flexor digitorum longus","Splits the medial head of gastrocnemius","Divides the interosseous membrane","Excises a segment of fibula"],a:0,e:"The deep compartment contains tibialis posterior, FDL, FHL, the posterior tibial vessels and tibial nerve; tibialis posterior may lie in its own sub-compartment."},
  {q:"Untreated compartment syndrome of the deep posterior compartment of the leg typically leaves:",o:["Claw toes and a cavovarus (equinus) foot from contracture of the long toe flexors and tibialis posterior","Foot drop","A flail ankle","Hallux valgus"],a:0,e:"Anterior compartment necrosis causes foot drop; deep posterior necrosis causes flexion contractures (Volkmann-type) of the toes and foot."},
  {q:"In children, early compartment syndrome is best recognised by the '3 As':",o:["Anxiety, agitation and an increasing analgesic requirement","Absent pulses, anaesthesia and akinesia","Ataxia, aphasia and apnoea","Anaemia, acidosis and anuria"],a:0,e:"Children cannot reliably describe pain on passive stretch — rising analgesia needs prompt pressure measurement or fasciotomy."},
  {q:"A patient presents several days after injury with an established, missed compartment syndrome (insensate, paralysed compartment). The usual management is:",o:["No fasciotomy — manage expectantly, monitor renal function, debride only if infection or systemic toxicity develops, and reconstruct later","Immediate four-compartment fasciotomy","Hyperbaric oxygen alone","Below-knee amputation in all cases"],a:0,e:"Late fasciotomy over dead muscle converts a closed sterile necrosis into an open infected one, with high infection and amputation rates."},
  {q:"Fasciotomy wounds are usually closed:",o:["At a second look after about 48 hours — delayed primary closure if tension-free (or gradual 'shoelace'/negative-pressure techniques), otherwise a split-skin graft","Primarily at the end of the fasciotomy","Never — they are left to heal by secondary intention over months","Only after fracture union"],a:0,e:"Closure under tension recreates the compartment; skin grafts are commonly needed for the anterolateral wound."}],
 exfix:[
  {q:"Standards for open fractures (BOAST 4) recommend intravenous antibiotics:",o:["As soon as possible, ideally within 1 hour of injury","Only after the wound is cultured","At the time of debridement in theatre","Only for Gustilo type III injuries"],a:0,e:"Early antibiotics are the most important modifiable factor in preventing infection."},
  {q:"For a high-energy open tibial fracture without gross marine, agricultural or sewage contamination, debridement should be performed:",o:["Within 12 hours of injury","Within 6 hours in every case","Within 72 hours","At the next elective list"],a:0,e:"Immediate surgery for highly contaminated wounds; within 24 hours for other low-energy open fractures."},
  {q:"Definitive soft-tissue cover of an open tibial fracture should ideally be achieved:",o:["Within 72 hours of injury (and within 7 days at most)","After the fracture has united","At 2–3 weeks once granulation tissue forms","Never — wounds heal by secondary intention"],a:0,e:"Combined orthoplastic 'fix and flap' at the same sitting gives the lowest infection rates."},
  {q:"The safe corridor for half-pins in the tibial shaft is:",o:["The anteromedial subcutaneous surface, pins perpendicular to it","Directly lateral, through the anterior compartment","Posteromedial, through the deep posterior compartment","Through the anterior crest from front to back"],a:0,e:"Lateral and posterior pins transfix muscle and endanger the anterior tibial and posterior tibial neurovascular bundles."},
  {q:"The bending stiffness of an external fixator half-pin is proportional to:",o:["The fourth power of its radius","Its length only","The square root of its radius","Its colour coding"],a:0,e:"A 5 mm pin is far stiffer than a 4 mm pin; frame stiffness also rises with pin spread and falls with bar-to-bone distance."},
  {q:"The 'near–far' principle of pin placement means:",o:["In each fragment, one pin is placed close to the fracture and one far from it","All pins are placed as close to the fracture as possible","Pins alternate between the near and far cortex","Pins are inserted from the far side of the limb"],a:0,e:"A wide working base in each fragment increases frame stability."},
  {q:"The final Gustilo-Anderson grade of an open fracture is assigned:",o:["After debridement in theatre","In the emergency department from the wound size","From the initial radiographs","At the time of definitive fixation only"],a:0,e:"Wound size alone misleads — periosteal stripping, contamination and the need for flap cover decide it."},
  {q:"When a temporary external fixator is converted to an intramedullary nail, the risk of deep infection is lowest if:",o:["Conversion is early (ideally within about 2 weeks) and the pin sites are clean","The frame stays on for at least 6 weeks first","The nail is inserted through infected pin tracks immediately","No antibiotics are given"],a:0,e:"Longer frame duration and pin-track infection raise infection after nailing; infected tracks are debrided and the nail delayed."}],
 "nail-piri":[
  {q:"The piriformis fossa entry for a straight antegrade femoral nail is chosen because it:",o:["Lies in line with the femoral medullary canal on both AP and lateral views","Is the easiest point to palpate in obese patients","Avoids all soft-tissue damage","Allows any nail design to be used"],a:0,e:"Trochanteric-entry nails have a built-in proximal lateral bend to compensate for their more lateral start."},
  {q:"Inserting a straight piriformis-design nail through a greater trochanter tip entry tends to cause:",o:["Varus malalignment of proximal fractures and comminution of the medial cortex","Valgus malalignment","Anterior cortical perforation of the distal femur only","No problems"],a:0,e:"Match the entry to the nail design: straight nails → piriformis fossa, bent (trochanteric) nails → trochanteric tip."},
  {q:"An entry point placed too far anteriorly in the piriformis fossa increases:",o:["Hoop stresses and iatrogenic bursting (comminution) of the proximal femur","The risk of a distal locking miss","Rotational malalignment only","Blood loss from the profunda femoris"],a:0,e:"An anterior start forces the nail to bend backward on entering the canal; a slightly posterior start is safer."},
  {q:"A vessel at risk from a piriformis fossa start that is too medial or posterior is:",o:["The deep (ascending) branch of the medial femoral circumflex artery supplying the femoral head","The superficial femoral artery","The lateral femoral circumflex artery's descending branch","The obturator artery"],a:0,e:"Avascular necrosis after antegrade nailing is reported mainly in adolescents with open physes — avoid piriformis entry in children."},
  {q:"Compared with piriformis entry, trochanteric-entry nailing has been associated with:",o:["Shorter operating and fluoroscopy times, especially in obese patients, with similar union rates","Higher non-union rates","More avascular necrosis in adults","An inability to treat subtrochanteric fractures"],a:0,e:"Both achieve high union rates; the entry must match the nail and the patient."},
  {q:"In skeletally immature adolescents needing a rigid antegrade femoral nail, the preferred start is:",o:["A lateral trochanteric entry, avoiding the piriformis fossa","The piriformis fossa","The femoral head","The lesser trochanter"],a:0,e:"Piriformis-fossa entry in children risks femoral head avascular necrosis through injury to the retinacular vessels."}],
 "ctr-mini":[
  {q:"The distal end of a limited (mini-open) carpal tunnel incision is placed at:",o:["Kaplan's cardinal line, which marks the level of the superficial palmar arch and the recurrent motor branch","The distal palmar crease","The proximal wrist crease","The thenar crease"],a:0,e:"Kaplan's line runs from the apex of the first web space toward the hook of the hamate, parallel to the proximal palmar crease."},
  {q:"The specific technical risk of a limited palmar incision is:",o:["Incomplete release of the proximal ligament and antebrachial fascia under the skin bridge","Injury to the deep palmar arch","Rupture of FDP","Dorsal sensory loss"],a:0,e:"Use a protective elevator under the ligament and confirm the release proximally."},
  {q:"In the limited-incision release, the palmar cutaneous branch of the median nerve is protected by:",o:["Keeping the release ulnar to the line of FCR and the skin bridge intact over the radial wrist","Dividing it deliberately","Releasing on the radial side of the ligament","Using a transverse wrist-crease incision"],a:0,e:"It arises about 5 cm proximal to the wrist crease and runs between FCR and palmaris longus to the thenar skin."},
  {q:"Compared with a standard open release, the limited incision gives:",o:["Similar long-term symptom relief with less early scar tenderness and pillar pain","Better long-term relief","More recurrences in every series","A higher rate of recurrent motor branch injury"],a:0,e:"The scar is shorter and away from the thenar and hypothenar pillars."},
  {q:"Pain over the thenar and hypothenar eminences after carpal tunnel release is attributed to:",o:["Changes in the ligament's attachments to the pisiform/hamate and trapezium/scaphoid (the 'pillars') as the arch widens","Median nerve transection","Ulnar artery thrombosis","Retained suture"],a:0,e:"Pillar pain usually settles over 3–6 months whatever the incision."},
  {q:"A 'Knifelight' or similar guarded instrument in limited-incision release is used to:",o:["Divide the proximal ligament and fascia beneath the intact skin while a guide protects the nerve","Close the skin","Harvest palmaris longus","Measure the canal pressure"],a:0,e:"The guide sits between the ligament and the nerve; the blade cuts only the tissue above it."}],
 achilles:[
  {q:"Most acute Achilles tendon ruptures occur:",o:["About 2–6 cm above the calcaneal insertion, in a relatively hypovascular watershed zone","At the musculotendinous junction in most cases","As bony avulsions from the calcaneus in most cases","Within 1 cm of the insertion"],a:0,e:"Typical patients are 'weekend warriors' in their 30s–40s playing intermittent explosive sports."},
  {q:"The Matles test for Achilles rupture is performed with the patient:",o:["Prone, knees flexed to 90° — the injured foot falls into neutral or dorsiflexion instead of the normal resting plantarflexion","Supine, squeezing the calf","Standing on tiptoe on one leg","Sitting, measuring passive dorsiflexion"],a:0,e:"It is also the intraoperative reference for repair tension; Simmonds' (Thompson) squeeze test is the other key clinical test."},
  {q:"In the Willits (2010) randomised trial, when non-operative treatment used accelerated functional rehabilitation, re-rupture rates compared with surgery were:",o:["Similar, without a significant difference","Five times higher without surgery","Higher after surgery","Zero in both groups"],a:0,e:"Surgery carried more soft-tissue complications; UKSTAR later found similar function at 9 months between the two strategies."},
  {q:"The main nerve at risk during percutaneous or mini-open Achilles repair is:",o:["The sural nerve, crossing the lateral border of the tendon","The saphenous nerve","The tibial nerve","The superficial peroneal nerve"],a:0,e:"Make the lateral stab incisions under direct vision, or use a jig that keeps the sutures inside the paratenon."},
  {q:"Drugs recognised as risk factors for Achilles tendinopathy and rupture include:",o:["Fluoroquinolone antibiotics and corticosteroids","Bisphosphonates","Beta-blockers","Proton pump inhibitors"],a:0,e:"The risk with fluoroquinolones is highest in older patients taking corticosteroids at the same time."},
  {q:"For a chronic Achilles rupture with a 6 cm gap after debridement, Myerson recommends:",o:["Flexor hallucis longus transfer, often combined with a V–Y lengthening of the gastrocnemius aponeurosis","Direct end-to-end repair","Functional bracing","Plantaris augmentation alone"],a:0,e:"Gaps under about 2 cm: end-to-end repair; 2–5 cm: V–Y advancement ± FHL; over 5 cm: FHL transfer ± V–Y."},
  {q:"Flexor hallucis longus is the preferred transfer for chronic Achilles reconstruction because it:",o:["Fires in phase with the triceps surae, is strong, lies next to the tendon and its low muscle belly brings blood supply to the area","Is supplied by the deep peroneal nerve","Has no effect on great toe function at all","Can be harvested without any incision"],a:0,e:"Harvest at the knot of Henry gives more length but endangers the medial plantar nerve; many surgeons harvest behind the ankle."},
  {q:"On a lateral ankle radiograph, Kager's triangle is bounded by:",o:["The Achilles tendon posteriorly, the deep flexor tendons (FHL) anteriorly and the superior border of the calcaneus inferiorly","The talus, navicular and cuboid","The tibia, fibula and talus","The plantar fascia and the calcaneus"],a:0,e:"Loss of the normal fat lucency (blurring of Kager's fat pad) supports an Achilles rupture; ultrasound or MRI confirms it."}],
 plateau:[
  {q:"A Schatzker type II tibial plateau fracture is:",o:["A lateral split-depression fracture","A pure lateral depression without a split","A medial plateau fracture","A bicondylar fracture with metaphyseal–diaphyseal dissociation"],a:0,e:"I lateral split, II lateral split-depression (the commonest), III pure depression, IV medial, V bicondylar, VI with metaphyseal–diaphyseal dissociation."},
  {q:"In a Schatzker II fracture with a wide split, the structure most often torn or trapped in the fracture is:",o:["The lateral meniscus","The ACL","The medial collateral ligament","The popliteal artery"],a:0,e:"A submeniscal arthrotomy lets you inspect it, free it from the fracture and repair it at closure."},
  {q:"'Raft' screws in tibial plateau fixation are:",o:["Several parallel subchondral screws just beneath the articular surface that support an elevated depressed segment","Screws across the fibula","Bicortical shaft screws below the plate","Screws placed into the intercondylar eminence only"],a:0,e:"They act like a raft under the joint surface; a void filler below them reduces subsidence."},
  {q:"After elevating a depressed plateau fragment, a randomised trial (Russell and Leighton) found that filling the void with calcium phosphate cement rather than autograft gave:",o:["Less subsidence of the articular surface","More subsidence","Higher infection rates","No benefit at all over leaving the void empty"],a:0,e:"It also avoids iliac crest donor-site morbidity."},
  {q:"For a high-energy bicondylar plateau fracture with severe swelling and blisters, the usual initial plan is:",o:["Spanning external fixation across the knee, CT, then definitive fixation once the soft tissues settle ('span, scan, plan')","Immediate open reduction through a single midline incision","Cast immobilisation","Skeletal traction for 6 weeks as definitive care"],a:0,e:"Staged management dramatically reduced the wound complication rates seen with early open fixation."},
  {q:"Accepted indications for operative fixation of a lateral plateau fracture include:",o:["Articular step-off over about 2–3 mm, condylar widening over about 5 mm, or varus/valgus instability over about 10° near extension","Any undisplaced fracture line","Isolated bone bruising on MRI","A Segond avulsion alone"],a:0,e:"Alignment and stability matter as much as the articular step for the long-term result."},
  {q:"A posterolateral plateau fragment that cannot be reached from the anterolateral approach is fixed through:",o:["A posterolateral approach (e.g. Frosch, or with a fibular head osteotomy), protecting the common peroneal nerve","A posteromedial Lobenhoffer approach","A medial parapatellar arthrotomy","The suprapatellar pouch"],a:0,e:"The nerve winds around the fibular neck and must be found before posterolateral dissection."}],
 "hemi-wj":[
  {q:"The key difference between the Watson-Jones (anterolateral) and Hardinge (direct lateral) approaches to the hip is that Watson-Jones:",o:["Uses the intermuscular interval between TFL and gluteus medius instead of a transgluteal split of gluteus medius and vastus lateralis","Divides the short external rotators","Uses a true internervous plane","Requires the patient to be prone"],a:0,e:"Both preserve the posterior capsule and rotators; Hardinge elevates an anterior gluteus medius–vastus lateralis sleeve, Watson-Jones retracts gluteus medius posteriorly (with a limited release if needed)."},
  {q:"In national hip-fracture registers (e.g. the Norwegian register), hemiarthroplasty through a posterior approach, compared with a lateral-based approach, is associated with:",o:["A higher risk of reoperation for dislocation","A lower risk of dislocation","No difference in any complication","More superior gluteal nerve injury"],a:0,e:"Lateral-based approaches trade a lower dislocation risk for more abductor-related limp; this is why NICE suggests considering an anterolateral approach for hemiarthroplasty."},
  {q:"A recognised complication of closed reduction of a dislocated bipolar hemiarthroplasty is:",o:["Dissociation of the bipolar head — the outer shell separates from the inner head and needs open reduction","Fracture of the polyethylene acetabular liner","Femoral nerve palsy in every case","Immediate stem loosening"],a:0,e:"Use gentle traction and image the components after reduction; a dissociated bipolar head stays in the acetabulum while the inner head dislocates."},
  {q:"Barrack grade A cementing of a femoral stem means:",o:["Complete filling of the medullary canal ('white-out') with no radiolucency at the cement–bone interface","Radiolucency covering up to half of the interface","A defective mantle with the stem touching cortex","No cement below the stem tip"],a:0,e:"B: radiolucency under 50%; C: 50–99% radiolucency or a defective mantle; D: 100% radiolucency or no cement at the tip — poorer grades predict loosening."},
  {q:"While broaching an osteoporotic femur for a cemented hemiarthroplasty, a short undisplaced calcar crack appears. Management:",o:["Pass a cerclage wire below the crack before cementing the stem, extending to a longer stem if the crack runs distally","Ignore it and pressurise the cement hard","Abandon the hemiarthroplasty and fix the neck with screws","Cement the broach in place"],a:0,e:"Unrecognised or unprotected cracks propagate under load; forceful levering and external rotation through an anterior-based approach increase the risk."},
  {q:"One-year mortality after a hip fracture in older adults is approximately:",o:["25–30%","2–3%","50–60%","Under 1%"],a:0,e:"Thirty-day mortality is around 6–8%; early surgery, orthogeriatric care and early mobilisation improve outcomes."}],
 "radshaft-thompson":[
  {q:"The proximal internervous plane of the dorsal (Thompson) approach to the radius lies between:",o:["Extensor carpi radialis brevis (radial n.) and extensor digitorum communis (posterior interosseous n.)","Brachioradialis and flexor carpi radialis","Anconeus and extensor carpi ulnaris","ECU and FCU"],a:0,e:"Distally the plane is between ECRB and extensor pollicis longus (PIN)."},
  {q:"The surface landmark for the Thompson incision is a line from:",o:["The lateral epicondyle of the humerus to Lister's tubercle, just ulnar to the radial styloid","The biceps tendon to the radial styloid","The olecranon to the ulnar styloid","The medial epicondyle to the pisiform"],a:0,e:"The volar (Henry) line runs from the lateral side of the biceps tendon to the radial styloid."},
  {q:"In the middle third of the dorsal approach, the two muscles that cross the radius obliquely in the floor of the wound are:",o:["Abductor pollicis longus and extensor pollicis brevis","Extensor indicis and extensor digiti minimi","Pronator teres and supinator","Brachioradialis and ECRL"],a:0,e:"These 'outcropping' muscles are freed and retracted, not divided."},
  {q:"During the Thompson approach, the posterior interosseous nerve is most easily found:",o:["Where it emerges from the supinator, about 1 cm proximal to the muscle's distal edge","Under brachioradialis next to the radial artery","Running with the ulnar artery","In the fourth dorsal compartment at the wrist only"],a:0,e:"It enters the supinator under the arcade of Frohse proximally; trace it before any dissection on the proximal radius."},
  {q:"To expose the proximal radial shaft beneath the supinator in the dorsal approach, the forearm is:",o:["Fully supinated, and the supinator detached from its radial insertion with the nerve protected inside the muscle","Fully pronated, and the supinator split in line with the radius","Kept neutral with a retractor around the radial neck","Flexed at the elbow with the supinator divided transversely"],a:0,e:"Supination brings the supinator insertion into view and moves the PIN away from the dissection."},
  {q:"A dorsal plate on the proximal third of the radius endangers the posterior interosseous nerve because:",o:["The nerve runs across the dorsal radius in this region and can be trapped or crushed beneath the plate","The nerve runs inside the medullary canal","The plate compresses the radial artery instead","The nerve lies on the ulna"],a:0,e:"Identify and protect the nerve and pass the plate under it under direct vision — or use the volar (Henry) approach for proximal fractures."}],
 patella:[
  {q:"Operative fixation of a patella fracture is indicated by displacement greater than about 3 mm, an articular step greater than about 2 mm, or:",o:["Loss of active knee extension (failed straight-leg raise)","Any visible fracture line","A bipartite fragment","An effusion"],a:0,e:"Undisplaced fractures with an intact extensor mechanism are treated in an extension brace with early, protected motion."},
  {q:"In anterior tension-band wiring of a transverse patella fracture, knee flexion:",o:["Converts the tensile force on the anterior surface into compression at the articular surface","Distracts the fracture at the articular surface","Has no effect on the fracture","Compresses only the anterior cortex"],a:0,e:"The cerclage must lie on the tension (anterior) side, hard against bone at the poles, deep to the K-wire ends."},
  {q:"Biomechanically, compared with modified tension-band wiring over K-wires, cannulated lag screws with an anterior tension band through them:",o:["Give a stronger construct with less fracture gapping","Are weaker and gap more","Are identical in strength","Cannot be used for transverse fractures"],a:0,e:"The screws add interfragmentary compression; the wire through the screws neutralises the tension."},
  {q:"The commonest reason for further surgery after patella tension-band wiring is:",o:["Symptomatic, prominent hardware needing removal","Non-union","Deep infection","Patellar tendon rupture"],a:0,e:"Removal rates are high; bending and burying the superior K-wire ends reduces irritation and migration."},
  {q:"After an inferior pole partial patellectomy, the patellar tendon should be reattached:",o:["Through drill holes close to the articular (posterior) margin of the remaining patella","To the anterior cortex","To the quadriceps tendon","To the tibial tubercle"],a:0,e:"Anterior reattachment tilts the patella and concentrates patellofemoral contact pressure."},
  {q:"A bipartite patella is distinguished from a fracture because it is usually:",o:["Superolateral, with smooth sclerotic margins, often bilateral and non-tender","Inferomedial with sharp edges","Always symptomatic","A result of a direct blow"],a:0,e:"Saupe classification: type I inferior pole, II lateral margin, III superolateral (commonest) — an X-ray of the other knee helps."},
  {q:"A patellar sleeve fracture in an 8–12-year-old:",o:["Avulses a large cartilage sleeve with only a small bony flake on X-ray, so it is easily underestimated and usually needs open repair","Is a stable injury treated with a bandage","Involves the superior pole only","Is the same as Sinding-Larsen–Johansson disease"],a:0,e:"A high-riding patella and inability to straight-leg raise are the clues; MRI or ultrasound shows the size of the sleeve."}],
 clavicle:[
  {q:"The Canadian Orthopaedic Trauma Society trial of displaced midshaft clavicle fractures found that plate fixation compared with a sling:",o:["Lowered non-union and symptomatic malunion and gave faster functional recovery","Made no difference to union","Increased non-union because of periosteal stripping","Was only better in patients over 65"],a:0,e:"Hardware irritation and removal remained the commonest complication of fixation."},
  {q:"After a midshaft clavicle fracture, the medial fragment is displaced superiorly by:",o:["Sternocleidomastoid","Pectoralis major","Trapezius only","Subclavius"],a:0,e:"The lateral fragment drops with the weight of the arm and is pulled medially by pectoralis major and latissimus dorsi — shortening and rotation."},
  {q:"Numbness over the upper chest below a clavicle plating scar is due to injury of the:",o:["Supraclavicular nerves (C3–C4, cervical plexus)","Long thoracic nerve","Suprascapular nerve","Lateral pectoral nerve"],a:0,e:"They cross the clavicle vertically in the subcutaneous layer; identify and preserve them where possible."},
  {q:"An advantage of anteroinferior over superior clavicle plating is that:",o:["Drilling is directed from anterior to posterior, away from the subclavian vessels and brachial plexus, with longer screws and less prominence","It needs no incision","It is biomechanically stronger in all loading modes","It avoids the supraclavicular nerves completely"],a:0,e:"Superior plates are biomechanically favourable under inferior bending, but their screws point at the neurovascular bundle."},
  {q:"A Neer type II lateral-end clavicle fracture is unstable because:",o:["The coracoclavicular ligaments stay with the lateral fragment, leaving the medial fragment unrestrained","The acromioclavicular joint is always dislocated","The deltoid pulls the medial fragment down","The trapezius pulls the lateral fragment up"],a:0,e:"Non-union rates are high; options include hook plates, lateral locking plates and coracoclavicular suture-button stabilisation."},
  {q:"In the Robinson (Edinburgh) classification, a displaced comminuted diaphyseal clavicle fracture is type:",o:["2B2","1A","3B1","2A1"],a:0,e:"Type 1 medial, 2 diaphyseal, 3 lateral; A undisplaced, B displaced; 2B1 simple or wedge, 2B2 comminuted."},
  {q:"The commonest reason for re-operation after clavicle plate fixation is:",o:["Symptomatic, prominent hardware needing removal","Deep infection","Non-union","Subclavian artery injury"],a:0,e:"Low-profile precontoured plates and anteroinferior placement reduce, but do not eliminate, implant irritation."}],
 "tibnail-lat":[
  {q:"McConnell's 'safe zone' for the tibial nail entry point on the AP view is centred:",o:["About 9 mm lateral to the midline of the tibial plateau, just medial to the lateral tibial spine, and about 23 mm wide","On the medial tibial spine","On the medial plateau, 15 mm medial to the midline","Over Gerdy's tubercle"],a:0,e:"Entering within this zone keeps clear of the menisci and their intermeniscal ligament and lines the nail up with the canal."},
  {q:"The intra-articular structures most at risk from the tibial nail entry reamer are:",o:["The anterior horns of the menisci (especially the lateral) and the intermeniscal ligament","The cruciate ligaments' femoral attachments","The popliteus tendon","The posterior horns of the menisci"],a:0,e:"Keep the entry at the anterior margin of the plateau and do not plunge the reamer posteriorly."},
  {q:"The extra-articular lateral parapatellar approach for semi-extended tibial nailing:",o:["Keeps the synovium intact and passes the instruments outside the knee joint while the knee is near extension","Passes the instruments through the patellofemoral joint","Requires everting the patella","Can only be used for distal-third fractures"],a:0,e:"It gives the reduction benefits of semi-extended nailing without crossing the patellofemoral cartilage; the patella is subluxed medially."},
  {q:"A randomised trial (Toivanen) comparing transtendinous with paratendinous (parapatellar) approaches for tibial nailing found:",o:["No significant difference in the rate of chronic anterior knee pain","Much less pain with the transtendinous approach","Much less pain with the paratendinous approach","No anterior knee pain with either"],a:0,e:"Anterior knee pain after nailing is common and multifactorial — nail prominence, cutaneous nerve injury and fat pad scarring all contribute."},
  {q:"A proximal-third tibial fracture is drifting into valgus during nailing. A blocking (Poller) screw is placed:",o:["In the proximal fragment, lateral to the intended nail path (the concave side of the deformity)","In the distal fragment, medial to the nail","Across the fracture site","In the proximal fragment, medial to the nail"],a:0,e:"Krettek's rule: the screw goes on the concave side of the deformity; for procurvatum, posterior to the nail in the proximal fragment."},
  {q:"On the final lateral image, the proximal end of the tibial nail should be:",o:["Flush with or just below the anterior tibial cortex at the entry, never proud","Protruding 5–10 mm above the plateau so it can be removed easily","Inside the knee joint","Distal to the tibial tubercle"],a:0,e:"A proud nail impinges on the patellar tendon and causes anterior knee pain; an end cap can adjust the height."}],
 "hemi-hardinge":[
  {q:"For hip hemiarthroplasty after a displaced intracapsular fracture, NICE (CG124) advises surgeons to consider:",o:["An anterolateral (including direct lateral) approach in favour of a posterior approach","A posterior approach in every case","A direct anterior approach in every case","Uncemented implants through any approach"],a:0,e:"Lateral-based approaches preserve the posterior capsule and short rotators, lowering dislocation in frail and cognitively impaired patients."},
  {q:"National standards for hip fracture surgery recommend operating:",o:["On the day of, or the day after, admission (within about 36 hours)","Within 7 days","Only after 72 hours of medical optimisation","At the next elective list"],a:0,e:"Delay is linked to higher mortality and complications; correct only treatable problems before theatre."},
  {q:"The Austin Moore and Thompson hemiarthroplasties differ in that:",o:["The Austin Moore has a fenestrated, uncemented stem with a collar, while the Thompson has a solid stem usually used with cement","The Thompson is bipolar and the Austin Moore unipolar","The Austin Moore is always cemented","They are identical apart from head size"],a:0,e:"Both are monoblock unipolar designs; modern guidance favours cemented stems."},
  {q:"For pain relief on admission with a hip fracture, NICE recommends:",o:["Systemic analgesia plus a peripheral nerve block (e.g. fascia iliaca or femoral block)","NSAIDs alone in the elderly","Waiting for spinal anaesthesia in theatre","Opioids only, with no regional block"],a:0,e:"Nerve blocks reduce opioid requirement and delirium; NSAIDs are generally avoided in frail older patients."},
  {q:"After a cemented hemiarthroplasty through a direct lateral approach, early rehabilitation should:",o:["Mobilise fully weight-bearing the next day without posterior hip precautions, while protecting the abductor repair (no resisted abduction) for about 6 weeks","Avoid all weight-bearing for 6 weeks","Use strict posterior hip precautions only","Begin with resisted abduction exercises in the first week"],a:0,e:"The weak link is the anterior abductor sleeve, not the posterior capsule."},
  {q:"An undisplaced (Garden I–II) intracapsular femoral neck fracture in a 75-year-old is usually treated by:",o:["Internal fixation with cannulated screws or a sliding hip screw","Cemented hemiarthroplasty in all cases","Total hip replacement in all cases","Skeletal traction for 6 weeks"],a:0,e:"Arthroplasty is for displaced intracapsular fractures; some surgeons also replace undisplaced fractures in very frail or osteoporotic patients."}],
 scaphoid:[
  {q:"The main blood supply of the scaphoid is:",o:["The dorsal carpal branch of the radial artery entering the dorsal ridge, supplying the proximal 70–80% retrogradely","The ulnar artery through the scapholunate ligament","Volar branches supplying the proximal pole directly","The anterior interosseous artery to the proximal pole"],a:0,e:"Gelberman and Menon: volar branches enter the tubercle and supply only the distal 20–30% — hence proximal pole non-union and avascular necrosis."},
  {q:"The 'humpback' deformity of a scaphoid waist fracture is defined on sagittal CT by:",o:["Flexion of the distal fragment with an intrascaphoid angle over about 35° (or a height-to-length ratio over 0.65)","Extension of the proximal fragment of 10°","Radial translation of the distal pole","Shortening of the radial styloid"],a:0,e:"The proximal pole follows the lunate into extension (DISI pattern); a humpback malunion limits extension and grip and is an indication for fixation."},
  {q:"A patient has snuffbox tenderness after a fall but normal scaphoid radiographs. The most sensitive imaging to diagnose or exclude an occult scaphoid fracture is:",o:["MRI","Repeat plain films at 2 days","Ultrasound","Bone scan at 24 hours"],a:0,e:"MRI also shows other carpal and distal radius fractures; CT is an alternative where MRI is unavailable. Splint the wrist until a fracture is excluded."},
  {q:"In scaphoid non-union advanced collapse (SNAC), the joint characteristically preserved is:",o:["The radiolunate joint","The scaphocapitate joint","The radioscaphoid joint at the styloid","The capitolunate joint"],a:0,e:"Stage I radial styloid–distal scaphoid, stage II scaphocapitate, stage III capitolunate; the spared radiolunate joint allows salvage by scaphoid excision and four-corner fusion or proximal row carpectomy (if the capitate head is healthy)."},
  {q:"A displaced proximal pole scaphoid fracture is best fixed through:",o:["A dorsal approach with the wrist flexed, entering the proximal pole just radial to the scapholunate ligament","A volar percutaneous approach through the tubercle","A cast for 12 weeks","Excision of the proximal pole"],a:0,e:"The screw must start in the small proximal fragment to compress it; protect EPL and the extensor tendons and avoid the dorsal ridge vessels."},
  {q:"For a proximal pole scaphoid non-union with avascular necrosis, the graft classically used is:",o:["A vascularised bone graft — the pedicled 1,2-intercompartmental supraretinacular artery (1,2-ICSRA) distal radius graft or a free medial femoral condyle flap","Non-vascularised iliac crest cancellous graft alone","Allograft bone chips","No graft — screw fixation alone"],a:0,e:"Non-vascularised grafts unite poorly when the proximal pole is avascular (punctate bleeding absent at surgery)."},
  {q:"In the Herbert classification of scaphoid fractures, type B fractures are:",o:["Acute unstable fractures (displaced, oblique, proximal pole, comminuted or with carpal dislocation)","Acute stable fractures of the tubercle and incomplete waist","Delayed unions","Established non-unions"],a:0,e:"A acute stable, B acute unstable, C delayed union, D established non-union (fibrous or sclerotic)."},
  {q:"Compared with an eccentric screw, a screw placed in the central axis of the scaphoid:",o:["Is longer and stiffer and is associated with faster union","Has a higher risk of joint penetration","Damages the blood supply more","Gives less compression"],a:0,e:"Central placement on all views is the technical goal of both volar and dorsal fixation."}],
 scfe:[
  {q:"Loder's classification of slipped capital femoral epiphysis divides slips by:",o:["Ability to bear weight (with or without crutches) — stable vs unstable","The Southwick angle","Duration of symptoms","Klein's line on the AP view"],a:0,e:"In Loder's series avascular necrosis occurred in about half of unstable slips and in none of the stable ones."},
  {q:"The Southwick slip angle is measured on the:",o:["Frog-lateral view, comparing the epiphyseal–shaft angle with the normal side (mild <30°, moderate 30–50°, severe >50°)","AP pelvis using Klein's line","CT axial cut through the physis only","Weight-bearing AP view"],a:0,e:"The epiphyseal–shaft angle is the angle between the line perpendicular to the physis and the femoral shaft axis."},
  {q:"In SCFE, the entry point for an in-situ screw is often on the anterior femoral neck because:",o:["The epiphysis slips posteriorly, so a screw perpendicular to the centre of the physis must start anteriorly","The lateral cortex is too thick to drill","It avoids the lateral femoral circumflex artery","It allows a sliding hip screw"],a:0,e:"A lateral-cortex start crosses the physis obliquely and tends to reach the anterosuperior head, with more risk of penetration."},
  {q:"SCFE in a child younger than 10 years or with short stature should prompt screening for:",o:["Endocrine or metabolic causes such as hypothyroidism, renal osteodystrophy or growth hormone therapy","Septic arthritis","Leukaemia","Perthes disease"],a:0,e:"These children have a high risk of bilateral slips — prophylactic fixation of the other hip is usually advised."},
