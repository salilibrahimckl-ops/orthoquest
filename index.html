 "tibnail-supra":[
  {q:"The main biomechanical reason suprapatellar nailing helps proximal-third tibial fractures is that semi-extension:",o:["Relaxes the extensor mechanism pull that drives the proximal fragment into procurvatum","Makes the canal wider","Removes the need for an accurate entry point","Prevents valgus by tightening the patellar tendon"],a:0,e:"Hyperflexion for infrapatellar nailing increases the quadriceps-driven procurvatum deformity."},
  {q:"In suprapatellar tibial nailing, the quadriceps tendon is entered by:",o:["A longitudinal midline split about 2–3 cm above the superior pole of the patella","A transverse tenotomy","Detaching it from the patella","Going through vastus medialis"],a:0,e:"A longitudinal split preserves the extensor mechanism; the semi-extended position keeps the patella away from the trochlea."},
  {q:"The structures most at risk from suprapatellar instrumentation without a protective sleeve are:",o:["The patellar and trochlear articular cartilage","The common peroneal nerve","The popliteal artery","The infrapatellar branch of the saphenous nerve"],a:0,e:"Arthroscopic studies show little chondral damage when a sleeve is used; reaming debris should be washed out."},
  {q:"Compared with infrapatellar nailing, randomised trials of suprapatellar nailing have generally shown:",o:["Better alignment and similar or less anterior knee pain","Much more anterior knee pain","Higher deep infection rates","Longer union times"],a:0,e:"Fluoroscopy is also easier with the leg flat and the C-arm unobstructed."},
  {q:"The nail entry point in suprapatellar nailing is:",o:["The same as infrapatellar nailing — just medial to the lateral tibial spine at the anterior edge of the plateau","The tibial tubercle","The centre of the medial plateau","Anterior to the patella"],a:0,e:"Only the route to the entry point changes; the entry itself follows the canal on both views."},
  {q:"Suprapatellar nailing is relatively contraindicated in:",o:["A septic knee or open fracture contaminating the knee joint","Proximal-third fractures","Distal-third fractures","Obese patients"],a:0,e:"The approach passes through the knee joint — a contaminated or infected joint is a contraindication."},
  {q:"During suprapatellar (semi-extended) tibial nailing the knee is usually held in about:",o:["10–20° of flexion on a ramp or bolster","90–110° of flexion over a triangle","Full hyperextension","60–70° of flexion"],a:0,e:"Hyperflexion is the infrapatellar position; semi-extension relaxes the quadriceps pull that drives proximal fractures into procurvatum."},
  {q:"An imaging advantage of semi-extended nailing is that:",o:["With the leg flat on the ramp, true AP and lateral views are obtained by rotating the C-arm without moving the leg or losing the reduction","No fluoroscopy is needed","The patella hides the entry point on the lateral view","Only an AP view is required"],a:0,e:"In hyperflexion the leg must be moved or the contralateral limb gets in the way of the lateral view."},
  {q:"Arthroscopic and MRI studies after suprapatellar nailing performed through a protective sleeve have generally shown:",o:["No significant increase in patellofemoral cartilage damage or patellofemoral pain compared with infrapatellar nailing","Severe patellofemoral arthritis within a year in most patients","Routine damage to the cruciate ligaments","A high rate of patellar tendon rupture"],a:0,e:"The sleeve keeps reamers and the nail off the patellar and trochlear cartilage."},
  {q:"At the end of a suprapatellar tibial nailing the knee joint should be:",o:["Irrigated to wash out reaming debris before the quadriceps tendon is closed","Left alone — debris is harmless","Injected with corticosteroid","Immobilised in a cylinder cast for 6 weeks"],a:0,e:"Retained metallic and bony debris can cause synovitis and chondral damage."}],
 kneescope:[
  {q:"The standard anterolateral arthroscopy portal of the knee is placed:",o:["About 1 cm above the lateral joint line and 1 cm lateral to the patellar tendon, with the knee flexed 90°","At the lateral joint line, touching the meniscus","Through the centre of the patellar tendon","2.5 cm above the superolateral patella"],a:0,e:"Too low cuts the anterior horn of the lateral meniscus; too high enters the fat pad and limits the view of the posterior horns."},
  {q:"The nerve most often injured during knee arthroscopy is:",o:["The infrapatellar branch of the saphenous nerve","The common peroneal nerve","The tibial nerve","The obturator nerve"],a:0,e:"It crosses below the patella from medial to lateral — medial portals and hamstring harvest incisions are the usual culprits."},
  {q:"According to Arnoczky and Warren, the vascularised (red) zone of the adult medial meniscus is:",o:["The peripheral 10–30% of its width","The inner third","The whole meniscus","Only the anterior horn"],a:0,e:"Supply comes from the perimeniscal capillary plexus (genicular arteries); the inner, white–white zone is avascular and heals poorly."},
  {q:"The lateral meniscus is more mobile than the medial meniscus because:",o:["It has no attachment to the lateral collateral ligament and is interrupted posterolaterally by the popliteus hiatus","It is attached to the deep MCL","Its horns are further apart","It has no meniscofemoral ligaments"],a:0,e:"Its greater mobility is one reason medial tears are commoner in chronic ACL deficiency."},
  {q:"For a degenerate meniscal tear in a middle-aged patient without true locking, randomised trials (e.g. the Finnish sham-controlled FIDELITY trial) found arthroscopic partial meniscectomy:",o:["No better than sham surgery or structured exercise therapy","Clearly superior to physiotherapy","Protective against osteoarthritis","Better than total knee replacement"],a:0,e:"First-line treatment is exercise therapy; arthroscopy is reserved for true mechanical locking or failed rehabilitation in selected patients."},
  {q:"Fairbank's radiological changes after meniscectomy include:",o:["An anteroposterior ridge on the femoral condyle, flattening of the condyle and joint-space narrowing","Patella alta and trochlear dysplasia","Tibial spine avulsion","Osteochondritis dissecans of the lateral condyle"],a:0,e:"They reflect the loss of hoop-stress load sharing — the reason meniscal tissue is preserved whenever possible."},
  {q:"During inside-out repair of the lateral meniscus, the posterolateral safety incision protects the common peroneal nerve by working:",o:["Anterior to the biceps femoris tendon, between it and the iliotibial band, retracting the lateral gastrocnemius head posteriorly","Posterior to the biceps tendon","Through the popliteal fossa in the midline","Medial to the semimembranosus"],a:0,e:"The nerve lies posterior and medial to biceps; medial repairs instead endanger the saphenous nerve, protected through a posteromedial incision."},
  {q:"A 25-year-old has an acutely locked knee from a displaced bucket-handle tear of the medial meniscus. Best management:",o:["Early arthroscopic reduction and repair of the meniscus where possible","Wait 6 months for spontaneous unlocking","Total meniscectomy","Manipulation under anaesthesia alone"],a:0,e:"Bucket-handle tears are longitudinal, often peripheral and repairable in young patients; check for an associated ACL rupture."},
  {q:"In the Outerbridge classification of chondral damage seen at arthroscopy, grade IV means:",o:["Exposed subchondral bone","Softening and swelling of the cartilage only","Partial-thickness fissuring less than 1.5 cm across","Fissuring to subchondral bone over more than 1.5 cm"],a:0,e:"Grade I softening, II partial-thickness fissures under about 1.5 cm, III deep fissuring to bone over a larger area, IV full-thickness loss with exposed bone."},
  {q:"A 'ramp' lesion associated with ACL rupture is:",o:["A tear at the meniscocapsular junction of the posterior horn of the medial meniscus, often hidden from the standard anterior view","A radial tear of the lateral meniscus root","An avulsion of the tibial spine","A cyclops nodule"],a:0,e:"It is found by passing the scope through the notch into the posteromedial compartment (modified Gillquist view) or via a posteromedial portal; unstable lesions are repaired."},
  {q:"When a posteromedial knee arthroscopy portal is made, the structures most at risk are:",o:["The saphenous nerve and great saphenous vein","The common peroneal nerve","The popliteal artery","The infrapatellar fat pad"],a:0,e:"Make it under transillumination and spinal-needle control in the soft spot behind the MCL, with the knee at 90°."},
  {q:"All-inside devices placed in the posterior horn of the lateral meniscus close to its root most endanger:",o:["The popliteal artery, lying just posterior to the posterior horn","The common peroneal nerve","The saphenous nerve","The inferior medial genicular artery"],a:0,e:"Use depth-limited devices and aim away from the midline; the peroneal nerve is at risk more laterally, behind biceps, with inside-out repairs."}],
 "ctr-endo":[
  {q:"In single-portal (Agee) endoscopic carpal tunnel release, the portal is made:",o:["In the proximal wrist crease, ulnar to palmaris longus","In the palm at Kaplan's cardinal line","Radial to the FCR tendon","Over the hook of the hamate"],a:0,e:"The two-portal (Chow) technique adds a distal palmar portal; both pass the device along the deep surface of the ligament."},
  {q:"The endoscopic device and blade are kept in line with:",o:["The radial border of the ring finger, hugging the hook of the hamate","The thumb","The index finger","The middle finger's ulnar border toward the thenar crease"],a:0,e:"This line keeps radial to Guyon's canal and ulnar to the median nerve and its recurrent motor branch."},
  {q:"The single most important rule when the endoscopic view becomes poor is to:",o:["Withdraw and convert to an open release","Cut the remaining fibres blindly","Increase the blade height","Release from proximal to distal faster"],a:0,e:"Most catastrophic nerve injuries in endoscopic release came from cutting without a clear view."},
  {q:"Compared with open carpal tunnel release, randomised trials and meta-analyses of endoscopic release show:",o:["Earlier return to work and grip strength, with similar long-term symptom relief","Better long-term symptom relief","Lower cost in every health system","No risk of nerve injury"],a:0,e:"Transient neurapraxia is slightly more frequent endoscopically; long-term results converge."},
  {q:"The transverse carpal ligament attaches radially to:",o:["The scaphoid tubercle and the ridge of the trapezium","The pisiform and hook of the hamate","The radial styloid","The capitate"],a:0,e:"Ulnarly it attaches to the pisiform and the hook of the hamate; it forms the roof of the carpal tunnel."},
  {q:"An endoscopic blade carried beyond the distal edge of the transverse carpal ligament most endangers:",o:["The superficial palmar arch and the common digital nerves","The anterior interosseous nerve","The deep palmar arch","The radial artery in the snuffbox"],a:0,e:"The superficial arch lies in the palmar fat just distal to the ligament — the visible fat marks the end of the release."}],
 "thr-wj":[
  {q:"In the Watson-Jones (anterolateral) hip approach, opening the interval too far proximally endangers:",o:["The inferior branch of the superior gluteal nerve supplying tensor fasciae latae","The femoral nerve","The lateral femoral cutaneous nerve","The inferior gluteal nerve"],a:0,e:"The branch runs forward between gluteus medius and minimus to enter TFL a few centimetres below the iliac crest; injury denervates TFL."},
  {q:"Exposure in the anterolateral approach is improved by releasing part of the gluteus medius insertion or osteotomising the trochanter. The main resulting risk is:",o:["Abductor insufficiency with a Trendelenburg limp","Sciatic nerve palsy","Posterior dislocation","Femoral artery injury"],a:0,e:"Repair any released abductor fibres securely; this is why muscle-sparing versions of the approach were developed."},
  {q:"The Röttinger (OCM) modification of the anterolateral approach is characterised by:",o:["Patient lateral, the TFL–gluteus medius interval used without detaching any abductor muscle","A transgluteal split of gluteus medius","Division of the short external rotators","Patient prone with a trochanteric osteotomy"],a:0,e:"It is a minimally invasive, muscle-sparing anterolateral approach; the leg is adducted and externally rotated into a sterile bag for femoral preparation."},

  {q:"To extend the anterolateral hip approach distally to expose the femoral shaft you:",o:["Continue down the lateral thigh, incise the fascia lata and elevate vastus lateralis off the lateral intermuscular septum","Split sartorius from rectus femoris","Release iliopsoas from the lesser trochanter","Develop the gracilis–adductor longus interval"],a:0,e:"It becomes the lateral approach to the femur; ligate the perforating vessels as vastus lateralis is lifted."},

 hemi:[

 ctr:[

function pickViva(id,n=3){const bank=OPQ[id]||[];S.opq=S.opq||{};let seen=S.opq[id]||[];if(seen.length+n>bank.length)seen=[];const pool=bank.map((q,i)=>i).filter(i=>!seen.includes(i));const sel=shuffle(pool).slice(0,n);S.opq[id]=seen.concat(sel);save();return sel.map(i=>bank[i])}
function runViva(proc,el,done){const qs=pickViva(proc.id);if(!qs.length){done();return}let k=0,right=0;
 const q=()=>{const Q=qs[k],order=shuffle([0,1,2,3]);el.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><p class="eyebrow">Post-op viva · ${esc(proc.name)} · ${k+1}/${qs.length}</p><p class="prompt">${esc(Q.q)}</p><div class="opts">${order.map((o,i)=>`<button class="opt" data-o="${o}"><span class="k">${"ABCD"[i]}</span><span>${esc(Q.o[o])}</span></button>`).join("")}</div><div id="vfb"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=+b.dataset.o,bs=[...el.querySelectorAll(".opt")];bs.forEach(x=>x.disabled=true);bs.find(x=>+x.dataset.o===Q.a).classList.add("ok");const ok=o===Q.a;if(ok)right++;else b.classList.add("bad");S.ans++;if(ok)S.cor++;save();
   document.getElementById("vfb").innerHTML=`<div class="fb ${ok?"":"bad"}"><b>${ok?"Correct":"Not quite"}.</b> ${esc(Q.e)}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="vnx">${k===qs.length-1?"See results":"Next question"}</button></div>`;
   document.getElementById("vnx").onclick=()=>{if(k===qs.length-1){addXP(right*30);done(right,qs.length)}else{k++;q()}}})};
 q()}

let _hand=null,gTok=0;
function makeHand(){const g=new THREE.Group();const glove=new THREE.MeshPhysicalMaterial({color:0xE6D8B8,roughness:.5,clearcoat:.35,transparent:true,opacity:.95});

 const a=new THREE.Vector3(0,.6,.8).normalize(),up=new THREE.Vector3(0,1,0);

 const at=(k,dx=0,dy=0,dz=0)=>{const v=a.clone().multiplyScalar(k);return[v.x+dx,v.y+dy,v.z+dz]};
 const tools={};
 const sc=new THREE.Group();g.add(sc);rod(metal,.004,.03,[0,0,0],at(.16),sc);rod(metal,.032,.03,at(.16),at(1.0),sc);tools.scalpel=sc;
 const di=new THREE.Group();g.add(di);rod(metal,.006,.012,[0,0,0],at(.12),di);rod(blue,.045,.04,at(.12),at(1.0),di);ball(new THREE.MeshStandardMaterial({color:0xF2C94C,transparent:true}),at(.5,0,.045,0),[.02,.012,.04],di);tools.diathermy=di;
 const fo=new THREE.Group();g.add(fo);rod(metal,.008,.016,[.012,0,0],at(.95,.03,0,0),fo);rod(metal,.008,.016,[-.012,0,0],at(.95,-.03,0,0),fo);tools.forceps=fo;
 ball(glove,at(.72,0,.12,0),[.2,.1,.26]);
 rod(glove,.045,.05,at(.25,0,.05,0),at(.62,0,.12,0));ball(glove,at(.25,0,.05,0),[.05,.05,.05]);
 rod(glove,.05,.055,at(.38,.1,-.02,0),at(.66,.12,.08,0));ball(glove,at(.38,.1,-.02,0),[.055,.055,.055]);
 [-.07,-.12,-.16].forEach((dx,i)=>{rod(glove,.045,.05,at(.48+i*.04,dx,-.05,0),at(.68,dx*.8,.06,0));ball(glove,at(.48+i*.04,dx,-.05,0),[.047,.047,.047])});

function poseHand(h,p,n,T){const y=n.clone().normalize();let z=T?T.clone().multiplyScalar(-1):new THREE.Vector3(1,0,0).applyQuaternion(E.cam.quaternion);z.addScaledVector(y,-z.dot(y));if(z.lengthSq()<1e-6)z=new THREE.Vector3(0,0,1);z.normalize();const x=new THREE.Vector3().crossVectors(y,z);h.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));h.position.copy(p)}

async function playGuide(c,gd){if(!gd)return;const tok=++gTok;if(!_hand)_hand=makeHand();const h=_hand;if(h.parent!==c.scene)c.scene.add(h);const ok=()=>tok===gTok;

 const run=async(fn,ms)=>{if(!ok())return false;await tween(ms,t=>{if(ok())fn(t)});return ok()};
 for(let rep=0;rep<2&&ok();rep++){h.visible=true;handOp(h,0);
  if(gd.kind==="incise"||gd.kind==="dissect"){const pts=gd.pts,L=pts.length-1,depth=gd.kind==="dissect"?-.05:0,P=i=>pts[Math.min(L,Math.max(0,i))];const n0=nAt(pts[0]),T0=pts[1].clone().sub(pts[0]);

   if(br)break;const pe=h.position.clone(),ne=nAt(pe);if(!await run(t=>{h.position.copy(pe).addScaledVector(ne,.5*t);handOp(h,.95*(1-t))},450))break}
  else{let p;if(gd.point)p=gd.point.clone();else{const o=gd.obj;const cv=o.geometry&&o.geometry.userData.curve;p=cv?cv.getPointAt(.5).applyMatrix4(o.matrixWorld):new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3())}
   const n=E.cam.position.clone().sub(p).normalize(),s=p.clone().addScaledVector(n,.12);
